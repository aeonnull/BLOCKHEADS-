<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BLOCKRUNNER // EXCALIBUR</title>
<style>
  :root{
    --ink:#0B0B0B; --bone:#ECE7DB; --orange:#F85000; --night:#13202b;
    --mono:"SF Mono",ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--ink);overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    -webkit-tap-highlight-color:transparent;touch-action:none;
    -webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
  /* stoppar markeringshandtag / förstoringsglas / klipp-klistra-meny på spelytan & knapparna */
  #wrap,canvas,.hud,.ctrls,.btn,.ring,.cta,.cta2,.music{
    -webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
  /* men namn-fältet ska gå att skriva i / redigera som vanligt */
  input,textarea{-webkit-touch-callout:default;-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;}
  #wrap{position:relative;width:min(100vw, calc(100dvh*0.56));height:100vh;height:100dvh;background:var(--ink);}
  /* MOBILFIX 2 (order): SAMMA utseende pa webb som pa mobil. Spelytan later som en telefon i portratt (aspekt 0.56,
     ~9:16) och centreras med morka kanter pa breda skarmar. Pa riktiga mobiler ar 100vw redan smalast -> ingen skillnad dar.
     resize() laser wrap.clientWidth/Height sa den logiska varlden (W) foljer automatiskt - banan, menyerna och
     karaktarsvalet far exakt samma layout overallt. */
  @supports not (height:100dvh){ #wrap{width:min(100vw, calc(100vh*0.56));} }
  /* DATOR-OPTIMERING (order: optimerad for BADE dator och mobil): pa breda skarmar med liggande format
     far spelytan vaxa till landskap (aspekt upp till 1.5) istallet for att klammas till en telefonkolumn.
     Den logiska varlden foljer med automatiskt (resize(): H=760 fast, W=cw/scale) sa banor, HUD och menyer
     skalar korrekt. Pa mobiler (smala skarmar / portratt) galler exakt samma layout som forut. */
  @media (min-width:900px) and (min-aspect-ratio:5/4){
    #wrap{width:min(100vw, calc(100vh*1.5));}
    @supports (height:100dvh){ #wrap{width:min(100vw, calc(100dvh*1.5));} }
  }
  canvas{display:block;image-rendering:pixelated;}
  .hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);}
  .eyebrow{position:absolute;top:14px;left:16px;color:var(--orange);font-size:11px;letter-spacing:.22em;font-weight:700;}
  .music{position:absolute;top:34px;left:16px;color:#6f675c;font-size:11px;letter-spacing:.18em;
    pointer-events:auto;cursor:pointer;font-weight:700;}
  .music.on{color:var(--bone);}
  .score{position:absolute;top:12px;right:16px;text-align:right;color:var(--bone);}
  .score .big{font-size:24px;font-weight:700;letter-spacing:.04em;line-height:1;}
  .score .lbl{font-size:8px;letter-spacing:.25em;color:#7d756a;margin-top:3px;}
  .best{margin-top:8px;}
  .best .big{font-size:13px;color:#9a9286;}

  .ctrls{position:absolute;left:0;right:0;bottom:0;height:170px;display:flex;pointer-events:none;}
  .ctrls.hidden{display:none;}
  .btn{flex:1;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.25em;color:#6f675c;}
  .btn .ring{width:78px;height:78px;border:2px solid #2a2620;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:rgba(15,13,11,.35);
    transition:transform .05s,border-color .08s,color .08s;}
  .btn.act .ring{transform:scale(.92);border-color:var(--orange);color:var(--bone);}
  .ring.shoot{border-color:#19E6A0;color:#9ff3d4;}
  .btn.act .ring.shoot{border-color:#19E6A0;color:#dffaf0;}

  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;text-align:center;pointer-events:auto;
    padding:18px 24px calc(18px + env(safe-area-inset-bottom));
    overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;}
  .panel::-webkit-scrollbar{display:none;}   /* rullisten mitt pa skarmen bort - innehallet scrollar anda med hjul/svep nar det behover */
  /* MOBILFIX (anvandarrapport: 'kommer inte at knapparna eller karaktarerna'): panelen var flex-centrerad UTAN
     scroll -> pa laga skarmar klipptes innehallet i BADA andar och gick inte att na. Nu: safe-centrering via
     auto-marginaler (centrerar nar det far plats, scrollar fran toppen nar det inte gor det), pan-y som
     overstyrer body:s touch-action:none, och krympta marginaler pa laga skarmar. */
  .panel>*{flex-shrink:0;}
  .panel>:first-child{margin-top:auto;}
  .panel>:last-child{margin-bottom:auto;}
  @media (max-height:720px){
    .title{font-size:clamp(26px,8vw,44px);}
    .sub{margin-top:10px;font-size:11px;line-height:1.7;}
    .cta{margin-top:16px;padding:12px 24px;}
    .cta2{margin-top:8px;}
    .nameinp{margin-top:14px;padding:9px 12px;}
    .charlbl{margin-top:12px;}
    .demolbl{margin-top:10px;}
    .lbwrap{margin-top:10px;}
  }
  .panel.hidden{display:none;}
  .title{color:var(--bone);font-size:clamp(36px,11vw,72px);font-weight:700;letter-spacing:.02em;line-height:.95;}
  .title .o{color:var(--orange);}
  .sub{color:#8d857a;font-size:12px;letter-spacing:.14em;margin-top:18px;line-height:1.9;max-width:340px;}
  .chasebox{margin:0 auto;display:inline-flex;flex-direction:column;gap:8px;padding:12px 18px;border:1px solid #2a2f3d;background:rgba(16,20,30,.55);text-align:left;}
  .chaserow{display:flex;align-items:center;gap:12px;font:700 11px/1 var(--mono);color:#bfb8ac;letter-spacing:.14em;white-space:nowrap;}
  .chaseic{width:18px;height:18px;flex:0 0 18px;image-rendering:pixelated;shape-rendering:crispEdges;}
  .cta{margin-top:30px;color:var(--ink);background:var(--bone);font-family:var(--mono);font-weight:700;
    font-size:13px;letter-spacing:.18em;padding:15px 30px;border:none;border-radius:2px;cursor:pointer;}
  .cta:active{transform:translateY(1px);}
  .cta2{margin-top:12px;color:#9a9286;background:transparent;border:2px solid #2a2620;font-family:var(--mono);
    font-weight:700;font-size:11px;letter-spacing:.2em;padding:11px 22px;border-radius:2px;cursor:pointer;}
  .cta2:active{transform:translateY(1px);}
  .demolbl{margin-top:20px;color:#6f675c;font-size:10px;letter-spacing:.24em;font-weight:700;font-family:var(--mono);}
  .demolvlrow{margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:340px;}
  .demolvlrow button{background:#141c26;color:#19E6A0;border:1px solid #19E6A0;font:700 11px var(--mono);
    letter-spacing:1px;padding:7px 9px;border-radius:2px;cursor:pointer;}
  .demolvlrow button:active{transform:translateY(1px);}
  .deadbig{color:var(--orange);font-size:11px;letter-spacing:.3em;}
  .deadscore{color:var(--bone);font-size:clamp(40px,14vw,84px);font-weight:700;line-height:1;margin-top:4px;}
  .nameinp{margin-top:24px;background:#0f0d0b;border:2px solid #2a2620;color:var(--bone);font-family:var(--mono);
    font-weight:700;font-size:14px;letter-spacing:.18em;text-align:center;padding:12px 14px;border-radius:2px;
    width:240px;max-width:70vw;outline:none;text-transform:uppercase;}
  .nameinp:focus{border-color:var(--orange);}
  .nameinp::placeholder{color:#5a534a;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .nameinp--shake{border-color:var(--orange)!important;animation:shake .45s ease;}
  .nameinp--shake::placeholder{color:var(--orange);}
  .lbwrap{margin-top:16px;width:290px;max-width:82vw;}
  .lbtitle{color:var(--orange);font-size:10px;letter-spacing:.3em;margin-bottom:8px;}
  .lblist{display:flex;flex-direction:column;gap:3px;}
  .lbrow{display:flex;justify-content:space-between;color:#9a9286;font-size:12px;letter-spacing:.06em;}
  .lbrow.me{color:var(--bone);}
  .lbrow .nm{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
  .lbrow .sc{color:#f7a000;font-weight:700;margin-left:10px;}
  .charlbl{color:#7d756a;font-size:9px;letter-spacing:.28em;margin-top:22px;}
  .charsel{display:flex;gap:7px;margin-top:9px;flex-wrap:nowrap;justify-content:flex-start;
    max-width:min(340px,86vw);overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;pointer-events:auto;
    scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
  .charsel::-webkit-scrollbar{height:4px;}
  .charsel::-webkit-scrollbar-thumb{background:#2a2620;border-radius:2px;}
  .charsel .ch{flex:0 0 auto;width:42px;height:60px;border:2px solid #2a2620;border-radius:3px;background:#0f0d0b;
    display:flex;align-items:flex-end;justify-content:center;cursor:pointer;padding:3px;transition:border-color .1s,transform .06s;}
  .charsel .ch.sel{border-color:var(--orange);}
  .charsel .ch:active{transform:translateY(1px);}
  .charsel .ch img{max-width:100%;max-height:100%;image-rendering:pixelated;}
  .charsel .ch canvas{max-width:100%;max-height:100%;image-rendering:pixelated;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="eyebrow">// BLOCKRUNNER</div>
    <div id="demoTag" style="position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#19E6A0;font-size:11px;letter-spacing:.28em;font-weight:700;display:none;">&#9655; DEMO &nbsp;·&nbsp; TAP TO EXIT</div>
    <div class="music on" id="musicBtn">&#9834; MUSIC</div>
    <div class="score">
      <div class="big" id="scoreVal">0</div>
      <div class="lbl">SCORE</div>
      <div class="best"><div class="big" id="coinVal" style="color:#f7a000">&#8383; 0</div></div>
      <div class="best"><div class="big" id="bestVal">BEST 0</div></div>

  </div>

  <div class="ctrls hidden" id="ctrls">

  <div class="panel" id="startPanel">
    <div class="title">BLOCKRUNNER<br><span class="o">EXCALIBUR</span></div>
    <div class="sub">

        <div class="chaserow"><svg class="chaseic" viewBox="0 0 14 14"><path fill="#ffd24a" d="M4 1 10 1 10 2 11 2 11 12 10 12 10 13 4 13 4 12 3 12 3 2 4 2z"/><path fill="#8a5a00" d="M6 3 8 3 8 5 9 5 9 6 8 6 8 7 9 7 9 9 8 9 8 11 6 11 6 8 7 8 7 7 6 7 6 6 7 6 7 5 6 5z"/></svg><span>SHIELD &nbsp;=&nbsp; BLOCKS 1 HIT &nbsp;&#183;&nbsp; ONLY 5</span></div>
        <div class="chaserow"><svg class="chaseic" viewBox="0 0 14 14"><path fill="#F85000" d="M7 1 8 1 8 2 9 2 9 3 10 3 10 4 11 4 11 5 12 5 12 6 13 6 13 8 12 8 12 9 11 9 11 10 10 10 10 11 9 11 9 12 8 12 8 13 6 13 6 12 5 12 5 11 4 11 4 10 3 10 3 9 2 9 2 8 1 8 1 6 2 6 2 5 3 5 3 4 4 4 4 3 5 3 5 2 6 2 6 1z"/><path fill="#ffd8a8" d="M6 5 8 5 8 6 9 6 9 8 8 8 8 9 6 9 6 8 5 8 5 6 6 6z"/></svg><span>RARE SAT &nbsp;=&nbsp; +21 &#8383; &nbsp;&#183;&nbsp; ONLY 4</span></div>
      </div>
    </div>
    <input id="nameInput" class="nameinp" maxlength="12" placeholder="YOUR NAME" autocomplete="off" spellcheck="false" />
    <div class="charlbl">CHOOSE YOUR BLOCKHEAD</div>
    <div id="charSelect" class="charsel"></div>
    <button class="cta" id="startBtn">TAP TO START</button>
    <button class="cta2" id="demoBtn">&#9655; WATCH DEMO</button>
  </div>

  <div class="panel hidden" id="deadPanel">
    <div class="deadbig">// BLOCKED</div>
    <div class="deadscore" id="deadScore">0</div>
    <div class="sub" id="deadMsg">NOT BAD.</div>
    <div class="lbwrap"><div class="lbtitle">TOP RUNNERS</div><div id="lbList" class="lblist"></div></div>
    <button class="cta" id="retryBtn">RUN AGAIN</button>
  </div>
</div>

<audio id="bgMusic" src="/neonnightchase.mp3" loop preload="auto" style="display:none"></audio>

  // ---------- CHARACTER TRAITS (gameplay identity per skin) ----------
  // CLASSIC (and any unrecognised skin) = all defaults => a complete no-op.
  // Each non-CLASSIC skin gets ONE clear bonus paired with ONE clear downside.
  //  starMargin  : +px on each side of the BIP-110 star hit window (MAGENTA bonus / BTC-CAMO penalty, negative)
  //  starYMult   : x on the BIP-110 star vertical hit tolerance (75px base)
  //  heartRadius : x on heart pickup half-width/height (MAGENTA penalty)
  //  shieldFree  : grant hasShield free at the start of every level (CHARCOAL bonus)
  //  bonusMult   : x on level-clear +150 bonus (CHARCOAL penalty)
  //  dodgeChance : 0..1 chance die() is dodged (SWOOSH bonus)
  //  exhaustSec  : seconds after a dodge during which coins/hearts can't be collected (SWOOSH penalty)
  //  magnetRadius: px radius that pulls coins/hearts toward the player (BTC bonus)
  //  rangeMult   : x on hammer-swing acquisition + rope-cut reach (BTC/CAMO penalty)
  //  scoreMult   : x on final score (TETRIS bonus)
  //  hitPad      : effective obstacle-collision inset in px (base 7; lower = bigger hitbox TETRIS, higher = smaller CAMO)

  function doShoot(){
    if(state==='start'){start();return;}
    if(state==='cleared'){if(clearedT>0.6)confirmNext();return;}
    if(state==='won'){if(clearedT>0.6)start();return;}
    if(state==='dead'){if(deadCooldown<=0)start();return;}
    if(zone==='roof'){
      if(fireCd>0) return;
      fireT=0.3; fireCd=0.45;
      stars.push({x:player.x+P_W*0.8,y:player.y-curH()*0.62,vx:speed+640,spin:0}); starsThrown++;
      return;
    }
    const _rm=trait().rangeMult||1;   // BTC/CAMO have a shorter attack reach
    if(charges>0 && player.onGround && swingT<=0){
      let m=null,md=1e9;
      for(const o of obstacles){ if(o.type==='mtn'&&o.hp>0){ const d=o.x-(player.x+P_W); if(d>-80 && d<360*_rm && d<md){md=d;m=o;} } }
      // niva 6/7: hammaren slar aven ner dronaren om ingen klippa ar narmare (enklaste integrationen - ateranvander samma svep/target-kod, se traff-upplosningen nedan)
      if(!m && drone){ const dd=drone.x-(player.x+P_W); if(dd>-80 && dd<360*_rm) m=drone; }
      if(!m && l7Bip && l7Bip.hp>0){ const dd=l7Bip.x-(player.x+P_W); if(dd>-80 && dd<360*_rm) m=l7Bip; }
      if(!m && l7Excal && !l7Excal.struck){ const dd=l7Excal.x-(player.x+P_W); if(dd>-80 && dd<360*_rm) m=l7Excal; }   // ORDER: Excalibur slas loss med hammaren
      if(m){ swingT=SWING_T; swingTarget=m; swingHit=false; return; }
    }
    if(fireCd>0||!player.onGround) return;
    fireCd=0.55;
    const reach=((H_STAND/FIRE_CHAR_HF)*FIRE_IMG_AR*FIRE_REACHF+40)*_rm;
    const beamY=player.y-H_STAND*0.60;
    let best=null,bd=1e9;
    for(const o of obstacles){ if(o.type==='rope'&&!o.cut){ const d=o.x-(player.x+P_W); if(d>=-12&&d<=reach&&d<bd){bd=d;best=o;} } }
    if(best){ fireT=0.34; best.cut=true; best.cutY=beamY; best.fallV=0; best.fallY=0;
      for(let i=0;i<18;i++)particles.push({x:best.x+ROPE_W/2,y:beamY,vx:(Math.random()-0.2)*280,vy:(Math.random()-0.5)*280,life:0.3+Math.random()*0.25,c:Math.random()<0.6?'#19E6A0':'#BFF6E2',s:4+Math.random()*4});
    } else if(level===5){
      // niva 5: inget rep i omedelbar vag -> kasta dynamit istallet (kraver ammo). Rep-klippning ovan gar ALLTID, oberoende av ammo. Egen kastbana, ingen paverkan pa fireT (ingen pistolvisual). Tomt forrad -> ingenting (ingen pistol-flash).
      if(dynAmmo>0){ dynamites.push({x:player.x+P_W*0.55,y:player.y-H_STAND*0.62,vx:DYN_VX,vy:DYN_VY0,state:'fly',t:0}); dynAmmo--; }
    } else {
      fireT=0.34;
      for(let i=0;i<6;i++)particles.push({x:player.x+95,y:beamY,vx:Math.random()*220+70,vy:(Math.random()-0.5)*120,life:0.2+Math.random()*0.15,c:'#19E6A0',s:3+Math.random()*3});
    }
  }

  function start(){ ensureAudio();

  function die(cause){
    if(state!=='run') return;                 // already dead / not in play
    if(igrace>0) return;                       // brief invulnerability after a save
    const pit = cause==='pit';                 // falling into the void can't be shielded/dodged
    const unblockable = pit || cause==='wall';  // niva 5:s berg (endBerg): som grop - kan ej skyddas/undvikas/demo-ryckas bort, bara sat/runa raddar (se dc87b63-defekten: standard die() lat spelaren "ryck pa axlarna" och glida rakt igenom via demo-shrug/skold/dodge)
    // DEMO: bot shrugs off every hit (except falling in a pit / the niva 5-berget) so the showcase always reaches the ninja + boss fights
    // demoInvuln kan stangas av via #dev-testkroken (__bh.setInvuln(false)) sa boten kan do pa riktigt for automatiserad empiri utan att andra den vanliga demo-visningen
    if(demo && demoInvuln && !unblockable){ igrace=0.6; shieldFlashT=0.3; flashT=Math.max(flashT,0.06); return; }
    if(!unblockable){
      const _dT=trait();
      // CHARCOAL / shield pickup: absorb one hit for free, keep running
      if(hasShield){ hasShield=false; shieldFlashT=0.5; igrace=0.5;
        shakeT=Math.max(shakeT,0.24); flashT=Math.max(flashT,0.10);
        const bx=player.x+P_W+16, by=player.y-curH()*0.6;
        for(let i=0;i<18;i++)particles.push({x:bx,y:by,vx:Math.random()*300+60,vy:(Math.random()-0.5)*360,life:0.35+Math.random()*0.3,c:Math.random()<0.5?'#7de8ff':'#ffffff',s:3+Math.random()*4});
        return; }
      // SWOOSH: random chance to phase through the hit, then a few seconds "exhausted"
      if((_dT.dodgeChance||0)>0 && Math.random()<_dT.dodgeChance){
        igrace=0.5; exhaustedT=_dT.exhaustSec||3.5; shieldFlashT=0.3;
        shakeT=Math.max(shakeT,0.14);
        const cx=player.x+P_W/2, cy=player.y-curH()*0.55;
        for(let i=0;i<22;i++)particles.push({x:cx,y:cy,vx:(Math.random()-0.5)*420,vy:(Math.random()-0.7)*360,life:0.4+Math.random()*0.35,c:Math.random()<0.5?'#b6f36a':'#ffffff',s:3+Math.random()*4});
        return; }
    }
    // ---------- RARE SAT: extraliv, galler alla dodsorsaker inkl. grop (efter skold/dodge) ----------
    if(!demo && satsGot>0){
      satsGot--; igrace=0.9; shieldFlashT=0.5;
      shakeT=Math.max(shakeT,0.24); flashT=Math.max(flashT,0.10);
      if(pit){ gaps=gaps.filter(g=>!(player.x+P_W*0.5>g.x && player.x+P_W*0.5<g.x+g.w));
        player.y=GROUND_Y; player.vy=0; player.onGround=true; ducking=false; }
      popText(player.x+P_W/2, player.y-curH()-20, 'SAT USED', '#e8ecf0');
      const sbx=player.x+P_W+16, sby=player.y-curH()*0.6;
      for(let i=0;i<18;i++)particles.push({x:sbx,y:sby,vx:Math.random()*300+60,vy:(Math.random()-0.5)*360,life:0.35+Math.random()*0.3,c:Math.random()<0.5?'#e8ecf0':'#ffffff',s:3+Math.random()*4});
      return;
    }
    // ---------- RUNA: fortsatt-biljett, bara om varken skold eller sat raddade ----------
    if(!demo && runesGot>0){
      runesGot--; shakeT=Math.max(shakeT,0.24); flashT=Math.max(flashT,0.10);
      popText(player.x+P_W/2, player.y-curH()-20, 'RUNE USED', '#ffd24a');
      restartLevel();
      return;
    }
    const ash=cause==='ash';
    state='dead'; deadCooldown=demo?0.8:0.5; shakeT=0.4; flashT=ash?0.05:0.14; lastDeathCause=cause||'hit';
    if(!demo){ startLevel=Math.max(startLevel,Math.min(level,10)); if(typeof refreshLvlSel==='function') refreshLvlSel(); }
    if(score>best)best=score;
    document.getElementById('deadScore').textContent=score;
    document.getElementById('bestVal').textContent='BEST '+best;
    document.getElementById('deadMsg').textContent=score<150?'WALK IT OFF.':score<450?'NOT BAD.':score<900?'GETTING DANGEROUS.':'CERTIFIED DEGEN.';
    if(!demo){ deadPanel.classList.remove('hidden'); ctrls.classList.add('hidden'); submitLB(playerName, score); }
    const cx=player.x+P_W/2,cy=player.y-curH()/2;
    for(let i=0;i<28;i++)particles.push({x:cx,y:cy,vx:(Math.random()-0.5)*520,vy:(Math.random()-0.9)*640,
      life:0.6+Math.random()*0.4,c:ash?(Math.random()<0.5?'#8a8a8a':'#55504a'):(Math.random()<0.5?ORANGE:BONE),s:4+Math.random()*5});
    if(ash)for(let i=0;i<26;i++)particles.push({x:cx+(Math.random()-0.5)*44,y:cy+(Math.random()-0.5)*70,vx:(Math.random()-0.5)*70,vy:40+Math.random()*130,life:0.8+Math.random()*0.6,c:'#6e6e6e',s:2+Math.random()*3});
  }

  function cityPropActive(){ return (level>=2 && level<=4) || (level===1 && lvlDist>LVL_LEN[1]*0.55); }   // gatuprylar bara pa niva 1(sent)-4; tak/vatten har egna hinder
  // Tva typer pa niva 1, fyra fran niva 2 och framat. Byt fritt i listorna.
  const L1_PROPS=['ball','hydrant'];                     // niva 1: fotboll + brandpost
  const L2_PROPS=['bin','ball','hydrant'];               // niva 2-4: soptunna, fotboll, brandpost (+ rivningskula)
  function makeCityProp(t,speed){
    const pool=(level===1)?L1_PROPS:L2_PROPS;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    // storleken foljer varje sprites aspekt (w = h * aspect) sa inget stracks ut
    const _cw=Math.max(34, speed*0.60 - P_W - 14);                                                                                    // max jumpbar bredd
    if(pick==='hydrant'){ let h=64+t*20+Math.random()*14, w=h*CITY_SPR.hydrant.aspect; if(w>_cw){w=_cw;h=w/CITY_SPR.hydrant.aspect;} return {prop:'hydrant', w, h, roll:0}; }  // storre, hogre brandpost
    if(pick==='bin'){     let w=Math.min(_cw, 56+t*12+Math.random()*10), h=w/CITY_SPR.bin.aspect; return {prop:'bin', w, h, roll:0}; }                                          // storre soptunna, bredd kapad
    if(pick==='ball'){    const s=34+t*8+Math.random()*8; return {prop:'ball', w:s, h:s, roll:35+t*15+Math.random()*10}; }  // rullar men slow nog att aldrig ta ikapp forra hindret
    if(pick==='antenn'){  const h=54+t*16+Math.random()*10; return {prop:'antenn', w:Math.max(16,h*CITY_SPR.antenn.aspect), h, roll:0}; }
    if(pick==='pipe'){    const clearW=Math.max(34, speed*0.60 - P_W - 14); const h=Math.max(22, Math.min(30+t*8, clearW/CITY_SPR.pipe.aspect)); return {prop:'pipe', w:h*CITY_SPR.pipe.aspect, h, roll:0}; }  // lagt brett ror -> hoppas over, aldrig bredare an ett hopp klarar
    const s=36; return {prop:'ball', w:s, h:s, roll:35};   // sakerhets-fallback
  }
  // ---------- HOJDVARIATION (bana 2 och uppat): fyra tydliga hojdband + anti-upprepning ----------
  // Loser monotonin "lagt hinder / ducka / lagt hinder / ducka": hopphindren far nu markant olika hojd.
  // Banden skalar med hur langt in i banan man ar (t) sa oppningen ar snallare, och kapas pa 72 = samma tak
  // som spelets befintliga block, sa varje hojd forblir hoppbar (hopphojden beror pa JUMP_V/GRAV, ej farten).
  // "run"/"lastI" pa funktionen sjalv ger ett litet minne: aldrig samma band tre ggr i rad.
  function pickGroundHeight(t){
    // Fotterna nar ~248px (JUMP_V^2/2*GRAV). Banden gar darfor upp mot 160 = riktig utmaning, inte 72-pygmeer.
    const tiers=[
      28+Math.random()*12,                      // lag nubb
      60+t*22+Math.random()*14,                 // mellan
      96+t*28+Math.random()*16,                 // hog
      Math.min(160, 120+t*40+Math.random()*16)  // torn (nara hopptaket)
    ];
    const S=pickGroundHeight;
    let i=Math.floor(Math.random()*tiers.length);
    if(i===S.lastI && (S.run||0)>=1){ i=(i+1)%tiers.length; }   // max tva i rad av samma band -> tvingar variation
    S.run=(i===S.lastI)?((S.run||0)+1):0; S.lastI=i;
    return Math.min(160, tiers[i]);
  }
  function spawnGround(){
    if(level===1 && l1Idx<L1SCRIPT.length){
      const [it,gap]=L1SCRIPT[l1Idx];
      if(it.k==='bin'){ const bw=Math.min(70,56), bh=bw/CITY_SPR.bin.aspect; obstacles.push({type:'ground',x:spawnX,y:GROUND_Y,w:bw,h:bh,prop:'bin'}); spawnX+=bw+gap; l1Idx++; lastAction='jump'; return; }
      if(it.k==='g1'){ obstacles.push({type:'ground',x:spawnX,y:GROUND_Y,w:30,h:30});
        if(l1Idx===0){ for(let i=0;i<3;i++)coinsArr.push({x:spawnX+90+i*70,y:GROUND_Y-95,bob:i*0.7,got:false}); } }
      else if(it.k==='g2'){ obstacles.push({type:'ground',x:spawnX,y:GROUND_Y,w:30,h:58}); }
      else if(it.k==='rope'){ obstacles.push({type:'rope',x:spawnX,w:ROPE_W,cut:false,fallY:0,fallV:0,cutY:0}); }
      else { obstacles.push({type:'air',x:spawnX,bottom:GROUND_Y-170,w:52,h:240}); }
      spawnX+=30+gap; l1Idx++; lastAction='jump'; return;
    }
    // ---------- L1-FINAL (ORDER v61b): SLUTET av bana 1 - tre brandposter i rad + dubbelhopp over tva hoga torn.
    // Triggas forst vid 72% av banan sa borjan forblir snall; fasta gap = alltid samma larbara rytm. ----------
    if(level===1 && l1FinIdx<5 && lvlDist>LVL_LEN[1]*0.72){
      const FIN=[['hyd',430],['hyd',430],['hyd',480],['g3',235],['g3',520]];
      const [fk,fgap]=FIN[l1FinIdx];
      if(fk==='hyd'){ const fh=84, fw=fh*CITY_SPR.hydrant.aspect;
        obstacles.push({type:'ground',x:spawnX,y:GROUND_Y,w:fw,h:fh,prop:'hydrant'}); spawnX+=fw+fgap; }
      else { obstacles.push({type:'ground',x:spawnX,y:GROUND_Y,w:30,h:70}); spawnX+=30+fgap; }
      l1FinIdx++; lastAction='jump'; lastWasRope=false; return;
    }
    // ---------- SPAWN-SKYDD MOT PLATTFORMAR (t.ex. sat-blocket): galler ALLA hindertyper ----------
    for(const p of plats){ if(spawnX>p.x-400 && spawnX<p.x+p.w+400){ spawnX=p.x+p.w+400; } }
    // ---------- BAKAT-SKYDD (niva 3): flytta HELA obstakel-spawnen (enstaka + kombon) forbi ett aktivt fallande blocks x-bana ----------
    // Ett block som redan schemalagts foljer banan fb.x (warn->fall->landad). Ett hinder som spawnar EFTER blocket co-travellar med konstant offset,
    // sa det racker att halla spawnX minst safeGap till hoger om varje aktivt blocks NUVARANDE x -> hindret hamnar aldrig i/intill landningszonen.
    if(level===3){ const fsg=Math.max(180,speed*0.85);
      for(const fb of fallers){ if(!fb.dead && spawnX>fb.x-fsg && spawnX<fb.x+fsg){ spawnX=fb.x+fsg; } } }
    // ---------- SPAWN-SKYDD MOT BERGET (niva 5): hall ovriga hinder/kombon borta fran bergets zon, sa dynamit-sprangningen alltid sker over fri mark ----------
    if(level===5){ const msg=Math.max(220,speed*0.9);
      for(const o of obstacles){ if(o.type==='mtn' && spawnX>o.x-msg && spawnX<o.x+MTN_W+msg){ spawnX=o.x+MTN_W+msg; } } }
    // ---------- INTRODUKTIONSBLOCK (endast niva 2): ETT garanterat hogt block (h:58), ensamt mitt i banan ----------
    if(level===2 && !introBlockSpawned && lvlDist>3000){
      if(lvlDist>=5000){ introBlockSpawned=true; }
      else{
        const it=Math.min(1,(speed-SPD_START)/300);
        const iMaxGap=Math.max(380-it*40, speed*0.82+80)+150+it*60;   // = befintlig maxGap-formel
        spawnX+=iMaxGap;                                              // generost avstand FORE (minst maxGap)
        for(const p of plats){ if(spawnX>p.x-400 && spawnX<p.x+p.w+400){ spawnX=p.x+p.w+400; } }
        const introClear = !gaps.some(g=>Math.abs(g.x-spawnX)<300) && !fallers.some(fb=>fb.state!=='landed' && Math.abs((fb.landX!=null?fb.landX:fb.x)-spawnX)<300);
        if(introClear){
          obstacles.push({type:'ground',x:spawnX,y:GROUND_Y,w:30,h:58});
          spawnX+=30+iMaxGap;                                         // generost avstand EFTER (minst maxGap)
          lastAction='jump'; lastWasRope=false;
          introBlockSpawned=true; return;
        } else { spawnX-=iMaxGap; }                                   // annars: forsok igen nasta anrop
      }
    }
    // ---------- KOMBOBIBLIOTEK (niva 2-5, samt 6-7 taket): tre handdesignade monster; niva 3 glesare (0.22), niva 4 annu glesare (0.16), niva 5 egen (0.19), niva 6/7 tat rytm for taksektionen (0.28) ----------
    if((level===2||level===3||level===4||level===5||level>=6) && Math.random()<(level===3?0.26:level===4?0.20:level===5?0.24:level>=6?Math.min(0.34,0.28+(Math.min(level,9)-6)*0.02):0.36)){
      const ct=Math.min(1,(speed-SPD_START)/300);
      const tMinGap=Math.max(380-ct*40, speed*0.82+80), tMaxGap=tMinGap+150+ct*60;
      const tailGap=tMinGap+Math.random()*(tMaxGap-tMinGap);
      const FULL_AIRTIME=2*Math.abs(JUMP_V)/GRAV, SHORT_AIRTIME=2*(JUMP_CUT*Math.abs(JUMP_V))/GRAV;   // last, aldrar ej fysiken
      const k=Math.floor(Math.random()*3);
      const firstW=(k===2)?ROPE_W:30;
      const kgap=(k===0)?speed*FULL_AIRTIME+30:(k===1)?speed*FULL_AIRTIME+40:speed*SHORT_AIRTIME+40;
      const secondX=spawnX+firstW+kgap;
      // kontrollera bade forsta OCH andra hindret i monstret mot plattforms-zonen (monstret far inte stracka sig in i den)
      const comboClear = !plats.some(p=>(spawnX>p.x-400&&spawnX<p.x+p.w+400)||(secondX>p.x-400&&secondX<p.x+p.w+400))

  // ---------- ORDER 5: NIVA 6/7 M2 (TAK) — egen monster-/hojdvarierad generator ----------

  // SAKERHET: varje efterfoljande lucka >= ett fullt hopps horisontella rackvidd + marginal (safeFloor),
  // varje markblock <= ett lagfarts-hopps bredd (clearW), och en KLIPPA spawnar ALDRIG utan hammarladdning

  // fran niva 1-5:s platta mark. SAKERHET: varje glapp <= ett hopps rackvidd, varje feature har plan tak-buffert
  // (safeFloor) fore OCH efter -> man landar alltid pa tak, aldrig omojligt; miss pa ett hogt tak landar pa bastaket.
  function spawnRoofM2(){
    const t=Math.min(1,(speed-SPD_START)/300);
    const FULL_AIR=2*Math.abs(JUMP_V)/GRAV;                 // full-hopp flygtid (last, aldrar ej fysiken)
    const clearW=Math.max(30, speed*0.60 - P_W - 14);
    const prog=Math.min(1, lvlDist/LVL_LEN[Math.min(level,10)]);
    const hard=prog>(level===9?0.0:level>=8?0.35:0.6);   // BLACKOUT: tataste rytmen i spelet fran forsta metern                    // sista tredjedelen: tatare rytm. ORDER (10 banor): bana 8-9 gar in i den tata rytmen redan efter en tredjedel
    const safeFloor=speed*FULL_AIR+52;                      // landningsrum: ett hopp landar ALLTID pa nasta taksegment
    const buf=(extra)=>safeFloor+(hard?58:84)+Math.random()*(hard?110:150)+(extra||0);   // plan tak-buffert mellan features (nagot tatare i sista tredjedelen)
    // feature: 0=VOID-GLAPP, 1=HOGRE TAK, 2=TAKHINDER, 3=DUCK-overhang, 4=KLIPPBERG (vavs in nar hammare finns)
    let f=Math.floor(Math.random()*4);

    if(level<10 && charges>0 && f===2 && Math.random()<0.5) f=4;        // ibland klippberg i stallet for ett takhinder (bara med laddning). Niva 7: inget berg pa taket (se order) - bara pa marken efter nedhoppet.
    m2PatRun=(f===m2LastPat)?m2PatRun+1:1; m2LastPat=f;
    let logstr;

                             : band<0.7 ? (108+Math.random()*26)         // mellan 108-134
                             :            (142+Math.random()*20));       // lang 142-162 (kapat mot farten)
      gaps.push({x:spawnX, w:gw}); spawnX+=gw+buf(); lastAction='jump'; logstr='gap'+Math.round(gw);
    } else if(f===1){                // HOGRE TAK — roof-plattform, hoga nivaer (lagsta lattaste niva borttagen pa order), hoppa upp pa & spring, fall av
      spawnX+=speed*0.35;            // VAGG-SKYDD (empiri): garanterad plan startstracka FORE blocket (samma trick som klippbergets runway) - blockets framkant ar numera en dodande vagg, och foregaende features landningspunkt far aldrig knapra pa upphoppets fonster

        const bh=132+t*22+Math.random()*16, bw=36+t*6;   // lika hog som gatans hogsta hinder. bw fast/bred (kod-ritad antenn, ej langre kopplad till spritens smala aspect-ratio)
        obstacles.push({type:'ground',x:spawnX,y:GROUND_Y,w:bw,h:bh,roofProp:true,antenn:true}); spawnX+=bw+buf(); lastAction='jump'; logstr='ant'+Math.round(bh);
      } else {
        const bh=104+t*14+Math.random()*24;                   // 104..~142 (hojd, aldrig "litet"; kapat sa fullhopps-apex 248 alltid klarar det)
        let bw=44+t*8+Math.random()*14; if(bw>clearW)bw=clearW;

      }
    } else if(f===3){                // DUCK-overhang — hangande antenn/kabel, ducka under
      const bw=50+t*24+Math.random()*18;

    } else {                         // KLIPPBERG — massivt (MTN6_H), spawnar bara med hammarladdning i hand
      spawnX+=speed*1.25;            // LANG plan runway FORE berget: spelaren star pa marken nar berget nar slagrackhall och hinner ALLTID sla alla 3 slag fore kontakt (inget hopp-parti tatt fore som staller en i luften)
      obstacles.push({type:'mtn',x:spawnX,w:MTN_W,hp:3,runeGot:false}); spawnX+=MTN_W+buf(90); lastAction='jump'; logstr='mtn';
    }
    if(typeof window!=='undefined' && window.__m2log) window.__m2log.push({f,logstr});   // dev-only empiri
    // gles myntbage pa ett plant takhinder-parti (aldrig vid glapp/klippa/duck sa inget plock-hopp krockar)
    if(f===2 && Math.random()<0.3){ const arcFrom=spawnX-buf()*0.4-40, arcTo=spawnX-60;
      if(arcTo>arcFrom+80){ const n=3+Math.floor(Math.random()*2), step=(arcTo-arcFrom)/Math.max(1,n-1);
        for(let i=0;i<n;i++){ const tt=n>1?i/(n-1):0.5; coinsArr.push({x:arcFrom+step*i,y:GROUND_Y-(240+120*Math.sin(Math.PI*tt)),bob:i*0.4,got:false}); } } }

    if(zone==='roof'){ const cap=210+Math.max(0,roofRuns-1)*45; speed=Math.min(speed,cap); }

    dist+=speed*dt; { const _sT=trait(), _sm=_sT.scoreMult||1, _cvm=_sT.coinValMult||1;

    }
    obstacles=obstacles.filter(o=> o.x+o.w>-60 && !(o.type==='mtn'&&o.hp<=0) && !(o.crate&&o.hp<=0));
    spawnX-=speed*dt;

    if(drone){
      drone.t+=dt; drone.bob+=dt;
      if(drone.phase==='in'){const tx=W*0.66;drone.x+=(tx-drone.x)*Math.min(1,dt*4);if(Math.abs(drone.x-tx)<6){drone.phase='charge';drone.t=0;}}
      else if(drone.phase==='charge'){
        // niva 6/7 surf-svepen (lag strale, se M1) kraver ETT hopp for att undvikas: elden far darfor ALDRIG oppna medan

        // Istallet: forlang laddningen tills spelaren star pa marken/ett block, och ge sedan minst 0.25s dar pa marken
        // (en riktig reaktionsruta pa den redan 1s+ langa laddningstellen) innan elden faktiskt oppnas.
        const lowBeam=drone.beamY>GROUND_Y-90;

        else if(drone.t>3.0){ if(lowBeam){ drone.phase='out'; drone.t=0; }   // ORDER 6: LAG strale far ALDRIG failsafe-avfyras mitt i ett hopp (dodade boten pa surf-descenten) -> retirera istallet nar ingen markruta gavs. Hog strale behaller failsafe.

    // ---------- BOSSDUELLEN ----------

    } else {

        if(l7Bip.hp<=0){ shakeT=Math.max(shakeT,0.4); flashT=Math.max(flashT,0.16); bonus+=150*bmult(); swingTarget=null; l7Bip.phase='open'; l7BipDone=true;

        for(let i=0;i<30;i++)particles.push({x:mx,y:mtop+10,vx:(Math.random()-0.5)*470,vy:-Math.random()*430,life:0.4+Math.random()*0.4,c:Math.random()<0.5?'#8a8a8a':(Math.random()<0.5?'#9fe8ff':'#ffd24a'),s:4+Math.random()*5});

            for(let i=0;i<22;i++)particles.push({x:mx,y:GROUND_Y-110,vx:(Math.random()-0.5)*360,vy:-Math.random()*420-80,life:0.4+Math.random()*0.4,c:Math.random()<0.6?'#f7a000':'#ffe08a',s:3+Math.random()*4}); } }
      }
    }
    // ---------- DYNAMIT (endast niva 5): kastad i bage, exploderar vid nedslag eller traff. Ateranvander bergets hp/bonus/runa-logik ovan, byter bara TRIGGERN. ----------

          for(let i=0;i<20;i++)particles.push({x:d.x,y:d.y,vx:(Math.random()-0.5)*420,vy:-Math.random()*380,life:0.3+Math.random()*0.3,c:Math.random()<0.5?'#ffb020':'#2a241e',s:3+Math.random()*4});
          if(hitObs){
            hitObs.hp--;
            if(hitObs.type==='mtn'){
              const sc=Math.max(hitObs.hp,1)/3, mx=hitObs.endBerg?hitObs.x+MTN_W*0.5:hitObs.x+MTN_W*sc*0.5;   // endBerg krymper inte -> centrera pa full bredd
              if(hitObs.hp<=0){ bonus+=20;
                if(hitObs.endBerg) mtn5Destroyed=true;   // bestandig flagga - level-gaten (se ovan) beror INTE pa att objektet fortfarande finns kvar i obstacles-arrayen
                for(let i=0;i<42;i++)particles.push({x:mx,y:GROUND_Y-30,vx:(Math.random()-0.5)*540,vy:-Math.random()*540,life:0.5+Math.random()*0.5,c:Math.random()<0.6?'#6e6e6e':'#4a4a4a',s:5+Math.random()*6});
                if(!hitObs.runeGot){ hitObs.runeGot=true; if(runesSpawnedRun<2){ runesSpawnedRun++; coinsArr.push({x:mx,y:GROUND_Y-320,bob:0,got:false,rune:true,life:RUNE_LIFE}); }   // ORDER v61d: runan FORTJANAS (hammare/dynamit pa berget), max 2/run, hoppas upp till
                  for(let i=0;i<22;i++)particles.push({x:mx,y:GROUND_Y-110,vx:(Math.random()-0.5)*360,vy:-Math.random()*420-80,life:0.4+Math.random()*0.4,c:Math.random()<0.6?'#f7a000':'#ffe08a',s:3+Math.random()*4}); }
              }
            } else if(hitObs.crate){
              // TNT-lada sprangs: bara explosionen, INGEN beloning (ingen bonus, inga mynt)
              for(let i=0;i<24;i++)particles.push({x:hitObs.x+CRATE_W*0.5,y:GROUND_Y-CRATE_H*0.5,vx:(Math.random()-0.5)*380,vy:-Math.random()*360,life:0.35+Math.random()*0.35,c:Math.random()<0.5?'#8a5a30':'#c9c9c9',s:3+Math.random()*4});
            }
          }
        }
      } else { d.boomT+=dt; }
    }
    dynamites=dynamites.filter(d=> d.state==='fly' || d.boomT<BOOM_T);
    coinTimer-=dt;
    if(coinTimer<=0){ coinsArr.push({x:W+40,y:GROUND_Y-(level===1?80+Math.random()*130:240+Math.random()*100),bob:Math.random()*6,got:false});
      coinTimer=(level===1?3.0:1.5)+Math.random()*2.3; }
    // bana 1: fem utplacerade beloningar sa banan inte blir tom, forst efter intromonstret
    if(level===1){ l1RewardT-=dt;
      if(l1RewardIdx<L1REWARDS.length && lvlDist>L1REWARDS[l1RewardIdx].at && l1RewardT<=0){
        const rw=L1REWARDS[l1RewardIdx];
        if(rw.k==='heart'){ hearts.push({x:W+80,y:GROUND_Y-232,bob:0,got:false}); }
        else if(rw.k==='rune' && shieldsSpawnedRun<5){ const r1Bx=W+120;
          plats.push({x:r1Bx,top:GROUND_Y-SAT_BLOCK_H,w:SAT_BLOCK_W});
          coinsArr.push({x:r1Bx+SAT_BLOCK_W/2+100,y:GROUND_Y-(SAT_BLOCK_H+SAT_ABOVE_BLOCK),bob:0,got:false,shield:true}); shieldsSpawnedRun++; }   // ORDER v61d: SKOLD pa sat-block
        else { for(let i=0;i<5;i++)coinsArr.push({x:W+60+i*64,y:GROUND_Y-(260+Math.sin(i)*40),bob:i*0.5,got:false}); }
        l1RewardIdx++; l1RewardT=1.2; } }
    const _cT=trait(), _cMag=_cT.magnetRadius||0, _cEx=exhaustedT>0;
    for(const cn of coinsArr){ cn.x-=speed*dt; cn.bob+=dt; if(cn.rune)cn.life-=dt;
      if(_cMag>0 && !cn.got){ const dx=(player.x+P_W/2)-cn.x, dy=(player.y-curH()*0.5)-cn.y, d=Math.hypot(dx,dy);
        if(d<_cMag && d>2){ const pull=Math.min(1,(_cMag-d)/_cMag)*420*dt; cn.x+=dx/d*pull; cn.y+=dy/d*pull; } }
      if(!cn.got && !_cEx){ const ph2=curH(), gx=(cn.rune||cn.shield)?34:30, gy=(cn.rune||cn.shield)?34:26, cy=cn.y+Math.sin(cn.bob*4)*6;
        if(player.x<cn.x+gx && player.x+P_W>cn.x-gx && player.y-ph2<cy+gy && player.y>cy-gy){
          cn.got=true;
          if(cn.shield){ hasShield=true; shieldFlashT=0.5; coinSfx(); flashT=Math.max(flashT,0.10);
            popText(cn.x,cy-30,'SHIELD','#7de8ff'); cn.got=true; continue; }
          if(cn.rune){ coins+=RUNE_BTC; coinSfx();   // ORDER v61d: runa = POANG, fortjanad via hammare/dynamit. Skyddsfunktionen bor i skoldarna. flashT=Math.max(flashT,0.10); shakeT=Math.max(shakeT,0.16);
            popText(cn.x,cy-30,'+'+RUNE_BTC+' \u20BF','#ffd24a');
            for(let i=0;i<30;i++)particles.push({x:cn.x,y:cy,vx:(Math.random()-0.5)*440,vy:-Math.random()*400,life:0.45+Math.random()*0.45,c:Math.random()<0.6?'#f7a000':'#ffe08a',s:4+Math.random()*5}); }
          else if(cn.sat){ coins+=SAT_BTC; satsGot++; rareSatCollectedThisLevel=true; coinSfx(); flashT=Math.max(flashT,0.10); shakeT=Math.max(shakeT,0.16);
            popText(cn.x,cy-30,'+'+SAT_BTC+' \u20BF','#e8ecf0');
            for(let i=0;i<30;i++)particles.push({x:cn.x,y:cy,vx:(Math.random()-0.5)*440,vy:-Math.random()*400,life:0.45+Math.random()*0.45,c:Math.random()<0.6?'#e8ecf0':'#ffffff',s:4+Math.random()*5}); }
          else { coins++; coinSfx();
            for(let i=0;i<14;i++)particles.push({x:cn.x,y:cy,vx:(Math.random()-0.5)*240,vy:-Math.random()*230,life:0.3+Math.random()*0.25,c:Math.random()<0.6?'#f7a000':'#ffe08a',s:3+Math.random()*4}); }
        } } }
    coinsArr=coinsArr.filter(cn=>!cn.got && cn.x>-40 && (!cn.rune || cn.life>0));
    updateParticles(dt);
  }
  function updateParticles(dt){
    for(const p of particles){ if(p.txt){ p.y+=p.vy*dt; } else { p.vy+=1500*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; } p.life-=dt; }
    particles=particles.filter(p=>p.life>0);
  }
  function popText(x,y,txt,col){ particles.push({x,y,vy:-60,life:0.9,maxLife:0.9,txt,c:col||'#ffe08a'}); }

  // ---------- mempool ----------
  function spawnSurgeBlock(left){
    const idx=SURGE_N-left, col=feeColAt(Math.max(feeHeat(),0.5)+idx*0.12);
    const kind=SURGE_PATTERN[idx%SURGE_PATTERN.length];
    if(kind==='air'){ obstacles.push({type:'air',x:W+40,bottom:GROUND_Y-BAR_BOTTOM_OFF,w:54,h:240,mp:true,col}); }
    else if(kind==='fall'){ const w=58,h=58; obstacles.push({type:'fall',x:W+130,y:-h-20,w,h,vy:0,landed:false,col}); }
    else { obstacles.push({type:'ground',x:W+40,y:GROUND_Y,w:46,h:64,mp:true,col}); }
  }
  function confirmBlock(){
    blockHeight++; chain.push(feeColAt(feeHeat(), Math.floor(Math.random()*3)-1)); if(chain.length>7)chain.shift();
    blockFill=0.04; bonus+=150; confirmMsgT=1.4;
    flashT=Math.max(flashT,0.16); shakeT=Math.max(shakeT,0.30);
    const cx=player.x+P_W/2, cy=player.y-H_STAND*0.6;
    for(let i=0;i<40;i++)particles.push({x:cx,y:cy,vx:(Math.random()-0.5)*520,vy:(Math.random()-0.6)*560,life:0.5+Math.random()*0.5,c:Math.random()<0.5?'#f7a000':(Math.random()<0.5?'#19E6A0':'#ffffff'),s:4+Math.random()*5});
    zapSfx();
  }
  function updateMempool(dt){
    if(confirmMsgT>0)confirmMsgT-=dt;
    if(state!=='run')return;
    const droneActive=drone&&(drone.phase==='charge'||drone.phase==='fire');
    if(!surge) blockFill+=speed*dt/FILL_DIST;
    if(dist<FIRST_SURGE_DIST) blockFill=Math.min(blockFill,0.78);   // ingen surge under uppvarmningen
    // floating transactions
    txTimer-=dt;
    if(!surge && txTimer<=0){ txArr.push({x:W+30,y:GROUND_Y-(90+Math.random()*210),bob:Math.random()*6,col:feeColAt(Math.min(1, feeHeat()*0.4 + Math.random()*0.9)),got:false}); txTimer=1.4+Math.random()*1.8; }
    for(const t of txArr){ t.x-=speed*dt; t.bob+=dt;
      if(!t.got){ const ph2=curH(), cy=t.y+Math.sin(t.bob*4)*5;
        if(player.x<t.x+TX_W && player.x+P_W>t.x && player.y-ph2<cy+TX_W && player.y>cy-TX_W){
          t.got=true; blockFill=Math.min(1,blockFill+TX_FILL); bonus+=5; coinSfx(); txPops.push({x:t.x+TX_W/2,y:cy-TX_W,t:0});
          for(let i=0;i<10;i++)particles.push({x:t.x+TX_W/2,y:cy,vx:(Math.random()-0.5)*220,vy:-Math.random()*200,life:0.3+Math.random()*0.2,c:Math.random()<0.5?t.col:'#ffffff',s:3+Math.random()*3});
        } } }
    txArr=txArr.filter(t=>!t.got && t.x>-30);
    for(const p of txPops)p.t+=dt; txPops=txPops.filter(p=>p.t<0.7);
    // trigger surge as the block nears confirmation
    if(!surge && false && blockFill>=SURGE_AT && !droneActive && zone!=='roof' && dist>FIRST_SURGE_DIST){ surge={phase:'warn',t:0,left:0,gapT:0}; }   // niva 6/7: mempool-"surge"-monstret (ateranvant fran gamla 6/10/11-konfigen) avstangt denna order - empirisk bot-testning visade att dess flerhinder-burst (ground+air+fall+ground i tat foljd) inte alltid gick att undvika tillforlitligt ihop med M1/M2:s egna hinder. Enklaste sakra losningen (se rapport); kan aterinforas och trimmas i en senare order
    if(surge){
      surge.t+=dt;
      if(surge.phase==='warn'){ if(surge.t>1.0){ surge.phase='active'; surge.t=0; surge.left=SURGE_N; surge.gapT=0.2; } }
      else if(surge.phase==='active'){
        surge.gapT-=dt;
        if(surge.left>0 && surge.gapT<=0){ spawnSurgeBlock(surge.left); surge.left--; surge.gapT=Math.max(SURGE_GAP,(speed*0.82+90)/speed); }
        blockFill=Math.min(1, blockFill + speed*dt/(FILL_DIST*0.55));
        if(surge.left<=0 && (blockFill>=1 || surge.t>3.6)){ confirmBlock(); surge.phase='done'; surge.t=0; }
      }
      else if(surge.phase==='done'){ if(surge.t>0.6) surge=null; }
    }
  }

  // ---------- draw ----------
  function drawBackground(){
    ctx.fillStyle=(level===3?'#64462e':level===4?'#2a2049':level===5?'#5a2818':level===6?'#0b3138':level===7?'#1b2731':level===8?'#171436':level===9?'#0d0f16':level===10?'#0d0f16':level>=6?'#0c2a33':NIGHT);
    ctx.fillRect(0,0,W,H);   // KRITISK BUGFIX (anvandarens skarmdumpar): 10-banorspatchen svalde av misstag denna fillRect in i sin radkommentar -> canvasen rensades ALDRIG mellan frames (spoksparen/jattegubben/randerna). Bakgrundstoner: niva 3 aprikos, 4 lila, 5 terrakotta, 8 djup natt-bla, 9 mork glod, ovriga 6+ petrolbla
    if(blueBlend>0.01){ ctx.globalAlpha=0.30*blueBlend; ctx.fillStyle='#1a3a7a'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
    if(l6RoofBlend>0.01){ ctx.globalAlpha=0.96*l6RoofBlend; ctx.fillStyle='#0d0f16'; ctx.fillRect(0,0,W,H);   // TAK = mork natthimmel (svart siluett-tak mot dov himmel, ref-bilderna)
      ctx.globalAlpha=0.6*l6RoofBlend; ctx.fillStyle='#171c28'; ctx.fillRect(0,0,W,Math.round(H*0.6)); ctx.globalAlpha=1; }   // svag ljushimmel upptill sa taken lyfter som siluett
    if((level===10||level===9) && l6RoofBlend>0.4){           // ORDER: mork natt = spelets GULA MANSKARA till VANSTER (samma som zon-manen, konsekvent), inte nagon stor blaffa till hoger
      const ma=Math.min(1,(l6RoofBlend-0.4)/0.5);
      ctx.globalAlpha=ma; ctx.strokeStyle='#e0a33c'; ctx.lineWidth=7;
      ctx.beginPath(); ctx.arc(120,150,52,Math.PI*0.42,Math.PI*1.72); ctx.stroke();
      if(level===10){ const grd=ctx.createLinearGradient(0,GROUND_Y-130,0,GROUND_Y);   // finalens gloande horisont behalls (diskret)
        grd.addColorStop(0,'rgba(140,45,32,0)'); grd.addColorStop(1,'rgba(140,45,32,0.24)');
        ctx.fillStyle=grd; ctx.fillRect(0,GROUND_Y-130,W,130); }
      ctx.globalAlpha=1;
    }
    if(level===7){                                            // STORM: tatt slagregn (droppar + stank vid marken) + blixtar
      const tR=performance.now()*0.001;
      // bakre lager: tunna, snabba streck for djup
      ctx.strokeStyle='rgba(150,175,205,0.22)'; ctx.lineWidth=1; ctx.beginPath();
      for(let i=0;i<60;i++){ const rx=(((i*131.3 + tR*820 + bgScroll*0.6)%(W+50))+(W+50))%(W+50)-25; const ry=(((i*71.9 + tR*1180)%(H+70))+(H+70))%(H+70)-35;
        ctx.moveTo(rx,ry); ctx.lineTo(rx-9,ry+22); }
      ctx.stroke();
      // framre lager: tydliga tjocka droppar
      ctx.strokeStyle='rgba(200,220,245,0.45)'; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.beginPath();
      for(let i=0;i<44;i++){ const rx=(((i*197.1 + tR*1020 + bgScroll*0.9)%(W+60))+(W+60))%(W+60)-30; const ry=(((i*143.7 + tR*1500)%(H+80))+(H+80))%(H+80)-40;
        ctx.moveTo(rx,ry); ctx.lineTo(rx-11,ry+34); }
      ctx.stroke(); ctx.lineCap='butt';
      // stank pa markplan
      ctx.fillStyle='rgba(200,220,245,0.40)';
      for(let i=0;i<20;i++){ const sx=(((i*263.4 + Math.floor(tR*9)*130 + bgScroll)%(W+40))+(W+40))%(W+40)-20; const ph=(tR*3+i*0.37)%1; const sw=2+ph*7;
        ctx.globalAlpha=0.4*(1-ph); ctx.fillRect(sx-sw/2, GROUND_Y-2-ph*6, sw, 2); }
      ctx.globalAlpha=1;
      if(stormBoltT>0){ ctx.globalAlpha=Math.min(0.6,stormBoltT*2.8); ctx.fillStyle='#eaf2ff'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; } }
    if(zoneBlend>0.01){
      ctx.globalAlpha=zoneBlend; ctx.fillStyle='#5b1b20'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#e0a33c'; ctx.lineWidth=7;
      ctx.beginPath(); ctx.arc(120,150,52,Math.PI*0.42,Math.PI*1.72); ctx.stroke();
      ctx.fillStyle='rgba(190,90,100,0.55)';
      ctx.fillRect(300,118,86,8); ctx.fillRect(318,110,54,8); ctx.fillRect(330,126,70,6);
      ctx.globalAlpha=1;
    }
    if(level===3){                                        // niva 3: Gamla Stockholm-siluett (tinnar och torn) ersatter skyskrapssiluetten
      drawOldTown(bgScroll*0.25,190,'#412c1d','#5c4419',84);   // ytterligare *0.75 (behaller aprikos/varm ton)
      drawOldTown(bgScroll*0.5,140,'#2e1d14','#534327',60);
    } else if(level===4){                                 // niva 4: brodistrikt (hangbro-pyloner + kablar) i lila skymning
      drawBridgeDistrict(bgScroll*0.25,190,'#221934','#4a3a66',96);
      drawBridgeDistrict(bgScroll*0.5,140,'#170f24','#382c50',72);
    } else if(level===5){                                 // niva 5: djup terrakotta industri (skorstenar, traverser, rorledningar, fabrikssiluetter)
      drawIndustrial(bgScroll*0.25,190,'#38160c','#6b3a22',90);
      drawIndustrial(bgScroll*0.5,140,'#260e08','#4a2818',66);
    } else if(level>=6){                                  // ORDER (konstnaren): varje bana EGEN siluettkaraktar i niva 3-kvalitet + landmarke. 6: Paris-mix · 7: London-mix · 8: Gamla stan i nattbla · 9/10: mork metropol-mix
      if(l6RoofBlend<0.985){ ctx.globalAlpha=1-l6RoofBlend*0.8;
        if(level===6){ drawEuroCity(bgScroll*0.25,185,'#062229','#7a6a45',88,0); drawEuroCity(bgScroll*0.5,135,'#03161c','#a8894e',62,0); }
        else if(level===7){ drawEuroCity(bgScroll*0.25,185,'#101b24','#5a6a78',88,1); drawEuroCity(bgScroll*0.5,135,'#0a1219','#8b93a4',62,1); }
        else if(level===8){ drawOldTown(bgScroll*0.25,190,'#0e0c26','#6a5a9e',84); drawOldTown(bgScroll*0.5,140,'#08061c','#b09040',60); }
        else { drawEuroCity(bgScroll*0.25,175,'#07080d','#4a4436',88,2); drawEuroCity(bgScroll*0.5,130,'#04050a','#6a5a38',62,2); }
        drawLandmark(bgScroll*0.35,1);
        ctx.globalAlpha=1; }
      if(l6RoofBlend>0.01){ drawLandmark(bgScroll*0.3,l6RoofBlend*0.9);
        if(level===10){ ctx.globalAlpha=l6RoofBlend;              // ORDER: bana 10 far INTE de platta staplarna - samma metropol-siluett som gatan, men SANKT (~60 % lagre) sa spelarens tak ligger tydligt OVANFOR staden
          drawEuroCity(bgScroll*0.25,62,'#07080d','#4a4436',88,2);
          drawEuroCity(bgScroll*0.5,44,'#04050a','#6a5a38',62,2); ctx.globalAlpha=1; }
        else drawL6Roofline(bgScroll*0.45, l6RoofBlend); }   // landmarket skymtar aven bakom taken
    } else {
      drawSkyline(bgScroll*0.25,200,'#0c1620',80,9000);
      drawSkyline(bgScroll*0.5,150,'#0a1118',58,4500);
    }
    drawRoofSkyline(bgScroll*0.4);
    ctx.fillStyle=INK; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    ctx.fillStyle='#241f1a'; ctx.fillRect(0,GROUND_Y,W,4);
    ctx.fillStyle='#1c1814'; const tick=42,off=(bgScroll%tick);
    for(let x=-off;x<W;x+=tick)ctx.fillRect(x,GROUND_Y+16,22,5);
    if(l6RoofBlend>0.01){                                     // ORDER 1/7: golvet läses som hustak — varm taklist/parapet i förgrunden + tjärduk (annat golv än M1:s kaj)
      ctx.globalAlpha=l6RoofBlend;
      ctx.fillStyle='#080a0d'; ctx.fillRect(0,GROUND_Y+4,W,H-GROUND_Y-4);         // svart tjarpapp (taket)
      ctx.fillStyle='#242832'; ctx.fillRect(0,GROUND_Y,W,6);                       // gra betong-parapet (standkant)
      ctx.fillStyle='#333844'; ctx.fillRect(0,GROUND_Y,W,2);
      ctx.fillStyle='#111318'; const gt=30,go=(bgScroll%gt);                       // grus/tjar-prickar
      for(let x=-go;x<W;x+=gt){ ctx.fillRect(x+6,GROUND_Y+24,5,3); ctx.fillRect(x+18,GROUND_Y+42,4,3); }
      ctx.globalAlpha=1;
    }
    drawL6Deco();                                             // ORDER 4b: containertrappan (M1->M2-overgang) i midgrund, bakom spelaren
    for(const g of gaps){
      if(g.water){                                     // ---- water crossing: blocky animated river ----
        ctx.save();
        ctx.beginPath(); ctx.rect(g.x,GROUND_Y,g.w,H-GROUND_Y); ctx.clip();
        ctx.fillStyle='#0e3a5a'; ctx.fillRect(g.x,GROUND_Y,g.w,H-GROUND_Y);          // deep water
        ctx.fillStyle='#155a86'; ctx.fillRect(g.x,GROUND_Y,g.w,22);                  // brighter surface band
        ctx.fillStyle='#3a97c9';                                                     // wave crests (row 1)
        const o1=(bgScroll*0.7)%28;
        for(let wx=g.x-o1-28; wx<g.x+g.w+28; wx+=28) ctx.fillRect(wx,GROUND_Y+3,14,5);
        ctx.fillStyle='#1f6c9c';                                                     // ripples (row 2)
        const o2=(bgScroll*0.45)%36;
        for(let wx=g.x-o2-36; wx<g.x+g.w+36; wx+=36) ctx.fillRect(wx+10,GROUND_Y+30,12,4);
        ctx.globalAlpha=0.5; ctx.fillStyle='#2b83b4';                                // deeper glints
        for(let wx=g.x-o1-40; wx<g.x+g.w+40; wx+=40) ctx.fillRect(wx+6,GROUND_Y+54,16,3);
        ctx.globalAlpha=1;
        ctx.restore();
        ctx.fillStyle='#241f1a'; ctx.fillRect(g.x-3,GROUND_Y,3,H-GROUND_Y); ctx.fillRect(g.x+g.w,GROUND_Y,3,H-GROUND_Y);
        // ORDER 4a: kajkant vid varje gap — betongläpp som skjuter ut över vattnet + pollare (hamnkänsla, tydlig bank)
        ctx.fillStyle='#5a6066'; ctx.fillRect(g.x,GROUND_Y-6,11,6); ctx.fillRect(g.x+g.w-11,GROUND_Y-6,11,6);
        ctx.fillStyle='#727981'; ctx.fillRect(g.x,GROUND_Y-6,11,2); ctx.fillRect(g.x+g.w-11,GROUND_Y-6,11,2);
        ctx.fillStyle='#2a2d31'; ctx.fillRect(g.x+2,GROUND_Y-13,6,7); ctx.fillRect(g.x+g.w-8,GROUND_Y-13,6,7);   // pollare
        continue;
      }
      // ORDER 1/7: M2-glapp = DROPP MELLAN HUSTAK — husväggar ner på båda sidor + upplysta fönster, mörk gata långt under
      ctx.fillStyle='#080405'; ctx.fillRect(g.x,GROUND_Y,g.w,H-GROUND_Y);                    // djupt mörk gränd i glappet
      ctx.fillStyle='#1c0d0d'; ctx.fillRect(g.x,GROUND_Y+3,11,H-GROUND_Y);                   // vänster husvägg
      ctx.fillStyle='#1c0d0d'; ctx.fillRect(g.x+g.w-11,GROUND_Y+3,11,H-GROUND_Y);            // höger husvägg
      ctx.fillStyle='#3a1616'; ctx.fillRect(g.x,GROUND_Y,g.w,3);                             // takkant över glappet
      ctx.globalAlpha=0.55; ctx.fillStyle='#ff9a4a';                                          // varma fönster på väggarna
      for(let wy=GROUND_Y+20; wy<H-6; wy+=32){ ctx.fillRect(g.x+3,wy,4,7); ctx.fillRect(g.x+g.w-8,wy,4,7); }

        ctx.fillRect(x+w*0.80,top+18,w*0.10,legH);
        ctx.fillRect(x,top,w,18);
        ctx.fillStyle=capCol; ctx.fillRect(x,top,w,4);
      } else {                                          // fabriksbyggnad, sagtandat tak
        const h=50+patt*maxH, top=GROUND_Y-h;
        ctx.fillStyle=color; ctx.fillRect(x,top,w,h);
        const teeth=4, tw=w/teeth;
        for(let i=0;i<teeth;i++){ ctx.beginPath(); ctx.moveTo(x+i*tw,top); ctx.lineTo(x+i*tw+tw*0.5,top-10); ctx.lineTo(x+(i+1)*tw,top); ctx.closePath(); ctx.fill(); }
        if(patt>0.45){ ctx.globalAlpha=0.5; ctx.fillStyle=capCol;
          ctx.fillRect(x+6,top+22,4,5); ctx.fillRect(x+w-12,top+38,4,5); ctx.globalAlpha=1; }
      }
    }
  }
  // Hamnsiluett (niva 6/7): magasin med containerstaplar, lastkranar (samma gantry-form som industrin), master med lanterna, ritad i kod.
  // Fast monster (som IND_H_PATTERN) sa siluetten tilar somlost utan flimmer nar bgScroll rullar.
  const HARBOR_H_PATTERN=[0.30,0.62,0.26,0.70,0.44,0.58,0.34,0.66];
  const HARBOR_TYPE=[0,1,0,2,1,0,1,0];   // 0=magasin+containrar, 1=lastkran, 2=mast med lanterna
  function drawHarbor(scroll,maxH,color,capCol,step){
    const off=scroll%step;
    for(let x=-off-step;x<W+step;x+=step){
      const idx=Math.floor((x+scroll)/step);
      const m=((idx%HARBOR_H_PATTERN.length)+HARBOR_H_PATTERN.length)%HARBOR_H_PATTERN.length;
      const patt=HARBOR_H_PATTERN[m], type=HARBOR_TYPE[m], w=step-8;
      if(type===1){                                     // lastkran: samma gantry-siluett som niva 5, hogre ben
        const legH=maxH*0.78, top=GROUND_Y-legH-22;
        ctx.fillStyle=color;
        ctx.fillRect(x+w*0.08,top+22,w*0.09,legH);
        ctx.fillRect(x+w*0.83,top+22,w*0.09,legH);
        ctx.fillRect(x,top,w,16);
        ctx.fillStyle=capCol; ctx.fillRect(x,top,w,4);
        ctx.fillStyle='#4a3a30'; ctx.globalAlpha=0.55; ctx.fillRect(x+w*0.46,top+16,4,legH*0.30); ctx.globalAlpha=1;   // hangande krok (dov)
      } else if(type===2){                              // mast med lanterna
        const h=maxH*(0.9+patt*0.5), top=GROUND_Y-h;
        ctx.fillStyle=color; ctx.fillRect(x+w*0.47,top,w*0.06,h);
        ctx.fillStyle='#6a5544'; ctx.globalAlpha=0.5+0.3*Math.abs(Math.sin(performance.now()*0.003+x)); ctx.fillRect(x+w*0.44,top-6,w*0.12,6); ctx.globalAlpha=1;
      } else {                                          // magasin med staplade containrar pa taket
        const h=48+patt*maxH, top=GROUND_Y-h;
        ctx.fillStyle=color; ctx.fillRect(x,top,w,h);
        ctx.fillStyle=capCol; ctx.fillRect(x,top,w,5);
        const cw=w*0.30, ch=maxH*0.20, cx0=x+w*0.10;
        const CCOLS=['#3a2a22','#26343a','#2a2420'];   // dova containertoner (rostbrun/stalgra/mork) - harmoniserar, inga skarande orange/bla klossar
        for(let i=0;i<3;i++){ ctx.fillStyle=CCOLS[(idx+i)%CCOLS.length]; ctx.fillRect(cx0+i*(cw+4),top-ch,cw,ch); ctx.globalAlpha=0.4; ctx.fillStyle='#000'; ctx.fillRect(cx0+i*(cw+4),top-ch,cw,3); ctx.globalAlpha=1; }
        if(patt>0.5){ ctx.globalAlpha=0.45; ctx.fillStyle='#5a4636'; ctx.fillRect(x+6,top+20,4,5); ctx.fillRect(x+w-12,top+36,4,5); ctx.globalAlpha=1; }
      }
    }
  }

  // player = MIO's artwork. neutral(1) running, jump = up(5)/apex(6), land/duck(4)
  const A_STAND=0.50, A_DUCK=1.183, A_UP=0.644, A_APEX=0.748;
  function drawPlayer(){
    const grounded=player.onGround;
    const pc=CHARS[selChar];
    if(pc && !pc.def){ drawGenericChar(pc, grounded); return; }
    if(zapT>0){
      if(Math.random()<0.7){const ex=player.x+P_W/2+(Math.random()-0.5)*100, ey=player.y-H_STAND*(0.25+Math.random()*0.85);
        particles.push({x:ex,y:ey,vx:(Math.random()-0.5)*140,vy:(Math.random()-0.5)*140,life:0.16,c:Math.random()<0.5?'#9fe8ff':'#ffffff',s:3+Math.random()*3});}
      const flick=Math.floor(zapT/0.08)%2===0;
      if(flick && zapImg.complete && zapImg.naturalWidth>0){
        const hh=H_STAND*1.12, ww=hh*ZAP_AR;
        ctx.imageSmoothingEnabled=false; ctx.drawImage(zapImg, player.x+P_W/2-ww/2, player.y-hh, ww, hh); return;
      }
    }
    if(fireT>0 && grounded && !ducking){
      const sq=Math.max(0,player.sq), sy=1-sq*0.10;
      const dh=(H_STAND/FIRE_CHAR_HF)*sy, dw=dh*FIRE_IMG_AR;
      if(spriteFire&&spriteFire.complete&&spriteFire.naturalWidth>0){
        ctx.imageSmoothingEnabled=false; ctx.drawImage(spriteFire, player.x, player.y-dh, dw, dh); return;
      }
    }
    const ducked=ducking&&grounded;
    let img, aspect;
    if(ducked){ img=spriteDuck; aspect=A_DUCK; }
    else if(!grounded){
      if(Math.abs(player.vy)>340){ img=spriteUp;   aspect=A_UP; }
      else                        { img=spriteApex; aspect=A_APEX; }
    } else if(landT>0){ img=spriteDuck; aspect=A_DUCK; }   // landing squash
    else { img=sprite; aspect=A_STAND; }

    const squash=Math.max(0,player.sq);
    const sx=1+squash*0.08, sy=1-squash*0.10;
    const w=P_W*sx, h=(w/aspect)*sy;
    const hop = (grounded && !ducked && landT<=0) ? -Math.abs(Math.sin(player.step))*3 : 0;
    const x=player.x-(w-P_W)/2, y=player.y-h+hop;
    const ready = img && img.complete && img.naturalWidth>0;
    if(ready){ ctx.imageSmoothingEnabled=false; ctx.drawImage(img, x, y, w, h); }
    else { ctx.fillStyle='#C0392B'; ctx.fillRect(x, player.y-H_STAND, P_W, H_STAND); }
  }
  // Alternate characters: one front sprite, all motion faked in code so any Blockhead drops in.
  function drawGenericChar(pc, grounded){
    const ducked = ducking && grounded;
    const sw = H_STAND*pc.aspect;                    // stand width matched to classic footprint
    const squash = Math.max(0,player.sq);
    let sx=1+squash*0.08, sy=1-squash*0.10;
    if(!grounded){ if(player.vy<-40){ sy*=1.06; sx*=0.95; }       // rising: stretch tall
                   else if(player.vy>60){ sy*=0.97; sx*=1.03; } } // falling: squat a touch
    if(landT>0){ sy*=0.90; sx*=1.08; }                            // landing squash
    const h=(ducked?H_DUCK:H_STAND)*sy;
    const w=(ducked?sw*1.18:sw)*sx;
    const hop=(grounded&&!ducked&&landT<=0)?-Math.abs(Math.sin(player.step))*3:0;
    const x=player.x+P_W/2-w/2, y=player.y-h+hop;
    if(pc.img&&pc.img.complete&&pc.img.naturalWidth>0){ ctx.imageSmoothingEnabled=false; ctx.drawImage(pc.img,x,y,w,h); }
    else { const bh=ducked?H_DUCK:H_STAND; ctx.fillStyle='#888'; ctx.fillRect(player.x,player.y-bh,P_W,bh); }
  }

  // niva 5: lador (LADBYTE) - tvadelade platta farg falt, morkare vansterkant (~28% av bredden) som skuggsida, inga bultar/dekor.
  // variant 1: sprangbar, morkt graybrun kropp + centrerad orange varningstriangel. variant 2: brun tralada. variant 3: orange tralada. Endast variant 1 reagerar pa dynamit.
  function drawCrate(x,y,w,h,variant){
    const edgeW=w*0.28;
    const body = variant===1 ? '#4a443c' : variant===2 ? '#8a5a28' : '#c26b1e';
    const edge = variant===1 ? '#332e28' : variant===2 ? '#5f3d1a' : '#8a4a15';
    ctx.fillStyle=body; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=edge; ctx.fillRect(x,y,edgeW,h);
    if(variant===1){
      const th=h*0.42, tw=th*1.15, cx=x+w*0.5, cy=y+h*0.5;   // varningstriangel: spets uppat, centrerad, ~42% av lådhöjden
      ctx.fillStyle='#f08a24';
      ctx.beginPath();
      ctx.moveTo(cx, cy-th*0.5);
      ctx.lineTo(cx+tw*0.5, cy+th*0.5);
      ctx.lineTo(cx-tw*0.5, cy+th*0.5);
      ctx.closePath(); ctx.fill();
    }
  }
  // stadshinder, ritade sa de gar att kanna igen. Allt halls inom o.w x o.h-rutan (matchar kollisionen)
  // utom sma utskott (hydrantens munstycken, tunnans lock). Fotbollen roterar med o.spin.
  function drawCityProp(kind,x,y,w,h,o){
    const cx=x+w/2;
    if(kind==='antenn'){                                       // TV-antenn, kod-ritad pa order - mork mast + TRE breda val-separerade tvargolv + kaninoron i toppen (las inte som "ett T med ett streck")
      const poleW=Math.max(3,w*0.16), px2=cx-poleW/2;
      ctx.fillStyle='#0d0d0d'; ctx.fillRect(px2,y+h*0.10,poleW,h*0.90);
      ctx.fillStyle='#3a3a3a'; ctx.fillRect(px2,y+h*0.10,Math.max(1,poleW*0.4),h*0.90);
      const bars=[[0.22,1.00],[0.46,0.72],[0.70,0.46]];         // [y-andel, breddandel] - stor, medel, liten, tydligt trappstegad
      for(const [ty,bwf] of bars){
        const by=y+h*ty, bw2=w*bwf;
        ctx.fillStyle='#1a1a1a'; ctx.fillRect(cx-bw2/2,by-3,bw2,6);
        ctx.fillStyle='#5a5a5a'; ctx.fillRect(cx-bw2/2,by-3,bw2,2);
      }
      ctx.strokeStyle='#0d0d0d'; ctx.lineWidth=Math.max(2,poleW*0.7); ctx.lineCap='round';   // kaninoron uppat mot toppen
      ctx.beginPath(); ctx.moveTo(cx,y+h*0.10); ctx.lineTo(cx-w*0.46,y); ctx.moveTo(cx,y+h*0.10); ctx.lineTo(cx+w*0.46,y); ctx.stroke();
      ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.arc(cx,y-2,3,0,Math.PI*2); ctx.fill();   // liten varningslampa i toppen
      return;
    }
    const SPR=CITY_SPR[kind];
    if(SPR && SPR.img.complete && SPR.img.naturalWidth){        // rita anvandarens sprite om den laddat
      ctx.save(); ctx.imageSmoothingEnabled=false;
      if(kind==='ball' && o && o.spin){ ctx.translate(x+w/2,y+h/2); ctx.rotate(o.spin); ctx.drawImage(SPR.img,-w/2,-h/2,w,h); }
      else ctx.drawImage(SPR.img,x,y,w,h);
      ctx.restore(); return;
    }
    if(kind==='hydrant'){                                    // brandpost
      ctx.fillStyle='#7c1c16'; ctx.fillRect(x, y+h-4, w, 4);                      // fot
      ctx.fillStyle='#c0392b'; ctx.fillRect(x+w*0.22, y+h*0.16, w*0.56, h*0.80);  // kropp
      ctx.fillStyle='#98271e'; ctx.fillRect(x+w*0.22, y+h*0.16, w*0.18, h*0.80);  // skuggsida
      ctx.fillStyle='#e2685a'; ctx.fillRect(x+w*0.66, y+h*0.16, w*0.05, h*0.80);  // hogdager
      ctx.fillStyle='#98271e'; ctx.fillRect(x-w*0.12, y+h*0.44, w*0.20, h*0.14);  // munstycke vanster
      ctx.fillStyle='#98271e'; ctx.fillRect(x+w*0.92, y+h*0.44, w*0.20, h*0.14);  // munstycke hoger
      ctx.fillStyle='#c0392b'; ctx.fillRect(x+w*0.32, y+h*0.02, w*0.36, h*0.16);  // huv
      ctx.fillStyle='#e2685a'; ctx.fillRect(x+w*0.32, y+h*0.02, w*0.36, 2);       // huv-topp
      ctx.fillStyle='#d7d7d7'; ctx.fillRect(cx-2, y, 4, h*0.05);                  // toppbult
      return;
    }
    if(kind==='bin'){                                        // soptunna
      ctx.fillStyle='#356e4a'; ctx.fillRect(x+w*0.10, y+h*0.16, w*0.80, h*0.84);  // kropp
      ctx.fillStyle='#2a5a3b'; ctx.fillRect(x+w*0.10, y+h*0.16, w*0.20, h*0.84);  // skuggsida
      ctx.fillStyle='#4a8a62'; ctx.fillRect(x+w*0.74, y+h*0.16, w*0.08, h*0.84);  // hogdager
      ctx.fillStyle='#234a31';                                                     // vertikala rappor
      for(let rx=x+w*0.26; rx<x+w*0.86; rx+=w*0.16) ctx.fillRect(rx, y+h*0.22, 2, h*0.74);
      ctx.fillStyle='#20402c'; ctx.fillRect(x, y+h*0.04, w, h*0.14);              // lock (skjuter ut)
      ctx.fillStyle='#3a7050'; ctx.fillRect(x, y+h*0.04, w, 2);
      ctx.fillStyle='#173322'; ctx.fillRect(cx-4, y, 8, h*0.05);                  // handtag
      return;
    }
    if(kind==='ball'){                                       // fotboll
      const cy=y+h/2, r=w/2;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(o&&o.spin?o.spin:0);
      ctx.fillStyle='#f5f5ef'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#16160f';
      const pent=(R,rot)=>{ ctx.beginPath(); for(let k=0;k<5;k++){ const a=rot-Math.PI/2+k*2*Math.PI/5; const px=Math.cos(a)*R, py=Math.sin(a)*R; k?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.fill(); };
      pent(r*0.30, 0);                                                            // mittpentagon
      ctx.strokeStyle='#16160f'; ctx.lineWidth=Math.max(1.4,r*0.09);
      for(let k=0;k<5;k++){ const a=-Math.PI/2+k*2*Math.PI/5;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*0.30, Math.sin(a)*r*0.30); ctx.lineTo(Math.cos(a)*r*0.82, Math.sin(a)*r*0.82); ctx.stroke();   // som
        ctx.fillStyle='#16160f'; ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.80, Math.sin(a)*r*0.80, r*0.13, 0, Math.PI*2); ctx.fill(); }           // ytterlapp
      ctx.strokeStyle='#c9c9c2'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(0,0,r-1,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      return;
    }
    if(kind==='bike'){                                       // cykel
      const wheelR=Math.min(h*0.34, w*0.20), wy=y+h-wheelR-2;
      const w1=x+wheelR+3, w2=x+w-wheelR-3;
      const seatX=x+w*0.42, seatY=y+h*0.26, barX=x+w*0.18, barY=y+h*0.20, crankX=(w1+w2)/2;
      ctx.strokeStyle='#2f93b8'; ctx.lineWidth=Math.max(3,h*0.09); ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(w1,wy); ctx.lineTo(crankX,wy); ctx.lineTo(seatX,seatY); ctx.lineTo(w1,wy);   // bakre triangel
      ctx.moveTo(seatX,seatY); ctx.lineTo(barX,barY); ctx.lineTo(crankX,wy);                  // toppror + nedror
      ctx.moveTo(barX,barY); ctx.lineTo(w2,wy);                                               // framgaffel
      ctx.stroke();
      ctx.strokeStyle='#1c2126'; ctx.lineWidth=Math.max(3,wheelR*0.32);                       // hjul
      ctx.beginPath(); ctx.arc(w1,wy,wheelR,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(w2,wy,wheelR,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='#6a7a86'; ctx.lineWidth=1;                                             // ekrar
      for(const wc of [w1,w2]) for(let a=0;a<Math.PI*2;a+=Math.PI/3){ ctx.beginPath(); ctx.moveTo(wc,wy); ctx.lineTo(wc+Math.cos(a)*wheelR*0.78, wy+Math.sin(a)*wheelR*0.78); ctx.stroke(); }
      ctx.fillStyle='#141b20'; ctx.fillRect(seatX-w*0.06, seatY-3, w*0.12, 4);                // sadel
      ctx.fillStyle='#141b20'; ctx.fillRect(barX-w*0.05, barY-3, w*0.10, 4);                  // styre
      return;
    }
    // kartong
    ctx.fillStyle='#b07a3e'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#8f5f2c'; ctx.fillRect(x,y,w*0.24,h);                          // skuggsida
    ctx.fillStyle='#caa063'; ctx.fillRect(x+w*0.72,y,w*0.06,h);                   // hogdager
    ctx.fillStyle='#9c6a34'; ctx.fillRect(x,y,w,h*0.16);                          // ovre flikyta
    ctx.fillStyle='#6f4a24'; ctx.fillRect(cx-1,y,2,h*0.16);                       // flikskarv
    ctx.fillStyle='#e7d7a2'; ctx.fillRect(x+w*0.42,y,w*0.16,h);                   // vertikal tejp
    ctx.fillStyle='#e7d7a2'; ctx.fillRect(x,y+h*0.14,w,4);                        // horisontell tejp
    ctx.strokeStyle='#6f4a24'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
    return;
  }
  function drawWball(o){
    const R=o._R||o.w/2, anchorY=(o._anchorY!=null?o._anchorY:GROUND_Y-160);
    const bx=(o.bx!=null?o.bx:o.x), by=(o.by!=null?o.by:anchorY+118);
    ctx.strokeStyle='#4a4a4a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(o.x,anchorY); ctx.lineTo(bx,by); ctx.stroke();  // rep
    ctx.fillStyle='#555'; ctx.fillRect(o.x-7,anchorY-5,14,6); ctx.fillStyle='#6a6a6a'; ctx.fillRect(o.x-7,anchorY-5,14,2);   // kranfaste
    const S=CITY_SPR.wball;
    if(S && S.img.complete && S.img.naturalWidth){ ctx.save(); ctx.imageSmoothingEnabled=false; ctx.drawImage(S.img,bx-R,by-R,2*R,2*R); ctx.restore(); }
    else { ctx.fillStyle='#2a2a2a'; ctx.beginPath(); ctx.arc(bx,by,R,0,Math.PI*2); ctx.fill(); }
  }
  // ORDER 4c: takelement som markhinder pa niva 6/7:s M2. Lag/smal = ventilationslada (louvers + kaptak);
  // hogre = skorsten/AC-stack (metallkropp, banderoll, kaptopp). Ren dekor-variant, kollisionen ar oforandrad.
  function drawRoofProp(x,y,w,h){
    if(h<108){                                       // ventilations-/AC-lada (kortare hindren)
      ctx.fillStyle='#3b4046'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#4c525a'; ctx.fillRect(x,y,w,5);            // ljus kaptopp
      ctx.fillStyle='#20242a';                                    // louver-galler
      for(let ly=y+9; ly<y+h-3; ly+=7) ctx.fillRect(x+4,ly,w-8,3);
      ctx.fillStyle='#3a4048'; ctx.fillRect(x,y,w,2);            // sval rimljus-kant
      ctx.fillStyle='#565f68'; ctx.fillRect(x,y+5,3,h-5);         // vanster kant-hogdager
    } else {                                          // skorsten / AC-stack (hogre hindren)
      ctx.fillStyle='#2f343a'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#454b52'; ctx.fillRect(x,y,w*0.34,h);        // ljus front-pelare
      ctx.fillStyle='#565f68'; ctx.fillRect(x-1,y-4,w+2,5);       // utskjutande kaptopp
      ctx.fillStyle='#3a4048'; ctx.fillRect(x,y+h*0.30,w,4);      // svalt band
      ctx.fillStyle='#1b1e22'; ctx.fillRect(x+w*0.62,y+h*0.5,w*0.24,h*0.4);  // skuggad ventgrop
    }
  }
  function drawMempoolBlock(x,y,w,h,col){
    ctx.fillStyle='#15110d'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=col; ctx.globalAlpha=0.9; ctx.fillRect(x,y,w,4); ctx.globalAlpha=1;
    // little tx grid
    const cell=9;
    for(let yy=y+5; yy<y+h-2; yy+=cell){ for(let xx=x+2; xx<x+w-2; xx+=cell){
      const a=0.35+Math.random()*0.0; ctx.globalAlpha=0.5; ctx.fillStyle=col; ctx.fillRect(xx,yy,cell-2,cell-2); } }
    ctx.globalAlpha=1; ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  }
  function drawObstacles(){
    for(const o of obstacles){
      if(o.type==='ground'){
        const x=o.x,y=o.y-o.h-(o.bnc||0),w=o.w,h=o.h;
        if(o.mp){ drawMempoolBlock(x,y,w,h,o.col); continue; }
        if(o.crate){ drawCrate(x,y,w,h,o.variant); continue; }
        if(o.roofProp){ if(o.antenn){ drawCityProp('antenn',x,y,w,h,o); } else { drawRoofProp(x,y,w,h); } continue; }   // ORDER 4c: M2-markhinder = takelement (ventlada/skorsten) eller anvandarens antenn
        if(o.prop){ drawCityProp(o.prop,x,y,w,h,o); continue; }   // niva 1-slut/niva 2: stadshinder
        ctx.fillStyle='#1a1714';ctx.fillRect(x,y,w,h);
        ctx.fillStyle=ORANGE;ctx.fillRect(x,y,w,5);
        ctx.fillStyle='#2a2420';ctx.fillRect(x,y+5,w*0.3,h-5);
        ctx.fillStyle='#0e0c0a';ctx.fillRect(x+w*0.4,y+h*0.4,w*0.2,w*0.2);
      } else if(o.type==='air'){
        const x=o.x,w=o.w,bot=o.bottom;
        if(o.mp){ drawMempoolBlock(x,0,w,bot,o.col); continue; }
        if(level>=6){                                    // niva 6/7 TAK: hangande hamnror istallet for generisk bom - grament rorlekropp, rostbandade skarvar, kall isbla glans
          ctx.fillStyle='#3a4148';ctx.fillRect(x,0,w,bot);
          ctx.fillStyle='#565f66';ctx.fillRect(x,0,w*0.32,bot);

  // niva 5:s garanterade berg: massivt kantigt klippberg (~halva skarmen), flera toppar/avsatser, ljus front + skuggsida, terrakotta-rimljus sa det sticker ut mot nivans terrakottamiljo. Krymper INTE med hp - skadan visas som glodande sprickor. ENDAST detta berg (o.endBerg); niva 6/10/11 anvander gamla konen nedan.
  function drawEndBerg(o){
    const b=GROUND_Y, x=o.x, w=MTN_W, h=MTN5_H;

      ctx.lineTo(x+w*0.56,b-h*0.70); ctx.lineTo(x+w*0.66,b-h*0.88);   // bitopp

    ctx.fillStyle='#23262b'; ctx.beginPath();
    ctx.moveTo(x+w*0.46,b-h*1.00); ctx.lineTo(x+w*0.66,b-h*0.88); ctx.lineTo(x+w*0.90,b-h*0.66);
    ctx.lineTo(x+w+18,b); ctx.lineTo(x+w*0.46,b); ctx.closePath(); ctx.fill();
    // ljus front (vanster halva)
    ctx.fillStyle='#4c535d'; ctx.beginPath();
    ctx.moveTo(x-16,b); ctx.lineTo(x-10,b-h*0.34); ctx.lineTo(x+w*0.10,b-h*0.52);
    ctx.lineTo(x+w*0.20,b-h*0.40); ctx.lineTo(x+w*0.34,b-h*0.72); ctx.lineTo(x+w*0.46,b-h*1.00);
    ctx.lineTo(x+w*0.40,b); ctx.closePath(); ctx.fill();
    // avsatser/hyllor (morka horisontella band)

    // ljusa klipp-kanter pa huvudtoppen
    ctx.fillStyle='#666e79';
    ctx.fillRect(x+w*0.44,b-h*1.00,3,h*0.20); ctx.fillRect(x+w*0.30,b-h*0.70,3,h*0.14);

    ctx.lineTo(x+w*0.34,b-h*0.72); ctx.lineTo(x+w*0.46,b-h*1.00); ctx.stroke();
    // skadesprickor: glodande orange, fler for varje traff
    if(dmg>0){ ctx.save(); ctx.strokeStyle='#ff7a1e'; ctx.lineWidth=2; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.moveTo(x+w*0.46,b-h*0.96); ctx.lineTo(x+w*0.40,b-h*0.60); ctx.lineTo(x+w*0.50,b-h*0.34); ctx.lineTo(x+w*0.44,b-h*0.06); ctx.stroke();

  // ORDER 3: KONERNA BORT. Alla berg/klippor som forr ritades som slat gra kon ritas nu som massivt KANTIGT

  function drawMountain(o){

    const dmg=Math.max(0,1-o.hp/3);                           // hammarskada -> glodande sprickor (utover krympningen)
    const ridge=()=>{ ctx.beginPath();
      ctx.moveTo(x-w*0.05,b);

      ctx.lineTo(x+w*0.42,b-h*0.86); ctx.lineTo(x+w*0.50,b-h*1.00);                                   // huvudtopp (~mh)
      ctx.lineTo(x+w*0.60,b-h*0.66); ctx.lineTo(x+w*0.72,b-h*0.82);                                   // bitopp
      ctx.lineTo(x+w*0.84,b-h*0.48); ctx.lineTo(x+w*0.94,b-h*0.58);                                   // sidotopp
      ctx.lineTo(x+w*1.05,b); ctx.closePath(); };
    ridge(); ctx.fillStyle='#565b61'; ctx.fill();            // massiv gra klippkropp
    ctx.save(); ridge(); ctx.clip();
    ctx.fillStyle='#383c41'; ctx.beginPath();                // skuggsida (hoger halva)
    ctx.moveTo(x+w*0.50,b-h*1.00); ctx.lineTo(x+w*0.72,b-h*0.82); ctx.lineTo(x+w*0.94,b-h*0.58);
    ctx.lineTo(x+w*1.05,b); ctx.lineTo(x+w*0.50,b); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#6b7178'; ctx.beginPath();                // ljus front (vanster halva)
    ctx.moveTo(x-w*0.05,b); ctx.lineTo(x+w*0.06,b-h*0.40); ctx.lineTo(x+w*0.18,b-h*0.60);
    ctx.lineTo(x+w*0.28,b-h*0.46); ctx.lineTo(x+w*0.42,b-h*0.86); ctx.lineTo(x+w*0.50,b-h*1.00);
    ctx.lineTo(x+w*0.44,b); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#33373c';                                 // avsatser/hyllor (morka horisontella band)
    ctx.fillRect(x+w*0.02,b-h*0.40,w*0.6,Math.max(3,h*0.02)); ctx.fillRect(x+w*0.26,b-h*0.60,w*0.5,Math.max(3,h*0.018));
    ctx.fillStyle='#828a93';                                 // ljusa klipp-kanter pa topparna
    ctx.fillRect(x+w*0.48,b-h*1.00,Math.max(2,w*0.02),h*0.20); ctx.fillRect(x+w*0.16,b-h*0.60,Math.max(2,w*0.02),h*0.12);
    if(dmg>0){ ctx.strokeStyle='#ff7a1e'; ctx.lineWidth=2; ctx.globalAlpha=0.85;   // skadesprickor: glodande orange, fler for varje traff
      ctx.beginPath(); ctx.moveTo(x+w*0.50,b-h*0.94); ctx.lineTo(x+w*0.44,b-h*0.58); ctx.lineTo(x+w*0.54,b-h*0.30); ctx.lineTo(x+w*0.48,b-h*0.05); ctx.stroke();
      if(dmg>0.5){ ctx.beginPath(); ctx.moveTo(x+w*0.66,b-h*0.66); ctx.lineTo(x+w*0.60,b-h*0.36); ctx.lineTo(x+w*0.70,b-h*0.08); ctx.stroke(); }
      ctx.globalAlpha=1; }
    ctx.restore();
    ctx.strokeStyle='#7d8790'; ctx.lineWidth=1.5; ctx.beginPath();   // kall rimljus langs ovre vanster rygg -> lyfter kantsiluetten
    ctx.moveTo(x+w*0.06,b-h*0.40); ctx.lineTo(x+w*0.18,b-h*0.60); ctx.lineTo(x+w*0.28,b-h*0.46);
    ctx.lineTo(x+w*0.42,b-h*0.86); ctx.lineTo(x+w*0.50,b-h*1.00); ctx.stroke();
    ctx.fillStyle='#22252a'; ctx.fillRect(x-w*0.05,b-4,w*1.10,4);     // markskugga vid basen
    if(!o.runeGot){ const rw=RUNE_W*0.92, rh=rw/RUNE_AR, rx=x+w*0.5, ry=b-h-RUNE_OFF-rh*0.5+Math.sin(o.x*0.05+performance.now()*0.004)*3;
      ctx.save(); ctx.globalAlpha=0.16+0.14*Math.abs(Math.sin(performance.now()*0.005)); ctx.fillStyle='#ffd24a';
      ctx.beginPath(); ctx.arc(rx,ry,rw*0.72,0,Math.PI*2); ctx.fill(); ctx.restore();
      if(runeImg.complete && runeImg.naturalWidth>0) ctx.drawImage(runeImg, rx-rw/2, ry-rh/2, rw, rh);
      else { ctx.fillStyle='#e69000'; ctx.fillRect(rx-rw/2,ry-rh/2,rw,rh); } }
  }
  function drawRope(o){
    const x=o.x,w=o.w,bottom=GROUND_Y-ROPE_BOTTOM_OFF;
    function seg(y0,y1){
      if(y1<=y0)return;
      ctx.fillStyle='#5C3D0A'; ctx.fillRect(x,y0,w,y1-y0);
      ctx.fillStyle='#7a520d'; ctx.fillRect(x,y0,Math.max(3,w*0.45),y1-y0);
      ctx.fillStyle='#b5790f';
      for(let yy=y0+6; yy<y1; yy+=16) ctx.fillRect(x+w*0.45,yy,w*0.55,5);
    }
    if(!o.cut){ seg(0,bottom); }
    else {
      const cy=o.cutY;
      seg(0,Math.max(8,cy-14));
      const by=cy+o.fallY;
      if(by<H+200) seg(by,by+(bottom-cy));
    }
  }
  function drawDrone(){

    else if(d.phase==='fire'){const th=30*Math.min(1,d.t*6)*(d.t>0.3?Math.max(0,(0.45-d.t)/0.15):1);
      ctx.fillStyle=ORANGE;ctx.globalAlpha=0.9;ctx.fillRect(0,d.beamY-th/2,d.x,th);
      ctx.globalAlpha=0.35;ctx.fillStyle=BONE;ctx.fillRect(0,d.beamY-th/4,d.x,th/2);ctx.globalAlpha=1;}
    ctx.fillStyle='#1a1714';ctx.fillRect(d.x,d.y,s,s*0.7);
    ctx.fillStyle='#2a2420';ctx.fillRect(d.x,d.y,s*0.3,s*0.7);
    const eyeOn=d.phase==='charge'?(Math.abs(Math.sin(d.t*22))>0.4):(d.phase==='fire');

  function drawDuel(){

        const S=p.pvar? CITY_SPR.pipeB : CITY_SPR.pipeA, dw=p.w, dh=dw/S.aspect, topY=p.top-S.boxTop*dh;
        if(S.img.complete && S.img.naturalWidth){ ctx.save(); ctx.imageSmoothingEnabled=false;

    if(l7Bip){ const rb=l7Bip, eyeY2=GROUND_Y-BIP_S+BIP_EYE, lowY2=GROUND_Y-BIP_LOW;

      const by=GROUND_Y-30-rise;                                                  // bladets nedre punkt (stiger vid traff)
      ctx.fillStyle='#efe7d8'; ctx.fillRect(exX-5,by-118,10,118);                  // blad
      ctx.fillStyle='#ffffff'; ctx.fillRect(exX-1,by-114,2,110);                   // egg-glimt
      ctx.fillStyle='#f7a000'; ctx.fillRect(exX-22,by-126,44,9);                   // parerstang

  function drawHammer(){

  // niva 5: dynamitbunt (3-4 rода stavar, svart mittband, glodande stubiner, morkare hogersida = skugga/djup), ritad i kod.
  // Ritas centrerad i origo. w/h skickas in ferdigskalade (DYN_DRAW = +40%). Alla dekorationer skalas med s=w/DYN_W sa hela spriten vaxer proportionellt.
  function drawDynBundle(w,h,tg){
    const nStick=4, sw=w/nStick, s=w/DYN_W;
    for(let i=0;i<nStick;i++){
      const sx=-w/2+i*sw;
      ctx.fillStyle=(i===nStick-1)?'#7a1010':'#c81a1a';
      ctx.fillRect(sx,-h/2,sw-1,h*0.78);
    }
    ctx.fillStyle='#0c0c0c'; ctx.fillRect(-w/2,-h/2+h*0.30,w,h*0.13);
    for(let i=0;i<nStick;i++){
      const sx=-w/2+i*sw+sw*0.5;
      ctx.fillStyle='#0c0c0c'; ctx.fillRect(sx-1*s,-h/2-6*s,2*s,6*s);
      const glow=0.5+0.5*Math.abs(Math.sin(tg*20+i));
      ctx.fillStyle=glow>0.75?'#fff3b0':'#ff9a1f';
      ctx.fillRect(sx-1.5*s,-h/2-8*s,3*s,3*s);
    }
  }
  function drawDynamite(d){
