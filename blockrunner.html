  // Chunky pixel-font "BIP" / "110" label, pre-rendered once to a tiny offscreen
  // canvas (nearest-neighbour upscaled at draw time) so it reads as blocky retro
  // text with no external font file.
  let bipTextCanvas=null;
  function getBipTextCanvas(){
    if(bipTextCanvas) return bipTextCanvas;
    const c=document.createElement('canvas'); c.width=28; c.height=18;
    const g=c.getContext('2d');
    g.imageSmoothingEnabled=false; g.textAlign='center'; g.textBaseline='middle';
    g.font='bold 8px monospace';
    // 1px dark "shadow" offset first (reads as a pixel outline once upscaled), then bright fill
    g.fillStyle='#1a0000'; g.fillText('BIP',15,6); g.fillText('110',15,14);
    g.fillStyle='#fff2c2'; g.fillText('BIP',14,5); g.fillText('110',14,13);
    bipTextCanvas=c;
    return c;
  }
  // BIP-110: the same Blockhead as the player, recoloured, mirrored, and ALIVE.
  // Same squash/stretch vocabulary as drawGenericChar, driven by the boss phase.
  function drawBipBoss(rb, lowPose, eyeY, lowY, CORE, HALO){
    const t=rb.t, ph=rb.phase;
    const running = (ph==='in'||ph==='out'||ph==='walk');   // ORDER (Bip_110.png): 'walk' = slutbossens framryckning mellan attackerna - springframes, inte idle
    const step = running ? Math.abs(Math.sin(rb.bob*9))*7 : Math.abs(Math.sin(rb.bob*4.5))*3; // always alive
    // Egen animerad BIP 110-boss: fem ritade poser, mappade per fas. Ingen omfargning,
    // ingen pafogad text - bilderna ar redan fardiga.
    let img=bipN, aspect=bipN_AR;
    let sx=1, sy=1, rot=0, ox=0, oy=-step;
    if(running){                                                        // spring: vaxla mellan upprätt & kort kropp
      const fr=Math.floor(rb.bob*7)%2===0; img=fr?bipN:bipShort; aspect=fr?bipN_AR:bipShort_AR; }
    else if(ph==='chargeH'){ img=bipAim; aspect=bipAim_AR;             // sikta högt (laddar hög stråle)
      const k=Math.min(1,t/0.8); sy=1-0.04*k; sx=1+0.04*k; }
    else if(ph==='fireH'){ img=bipAim2; aspect=bipAim2_AR;             // avfyra högt - luta fram
      const k=Math.max(0,1-t*5); sy=1+0.05*k; ox=-16*k; }
    else if(ph==='chargeL'){ img=bipDuck; aspect=bipDuck_AR;           // huka för lågt svep
      const k=Math.min(1,t/0.8); sx=1+0.05*k; sy=1-0.03*k; }
    else if(ph==='fireL'){ img=bipDuck; aspect=bipDuck_AR;             // lågt utfall, hukad
      const k=Math.max(0,1-t*5); sx=1.05; ox=-14*k; }
    else if(ph==='chargeBall'){ img=bipAim; aspect=bipAim_AR;          // lyft boll-på-kedja (sikta)
      const k=Math.min(1,t/0.85); sy=1+0.04*k; oy-=4*k; }
    else if(ph==='throwBall'){ img=bipAim2; aspect=bipAim2_AR;         // kast-utfall
      const k=Math.max(0,1-t*4); sy=1+0.04*k; ox=-16*k; }
    else if(ph==='open'){ img=bipDuck; aspect=bipDuck_AR; }            // stukad & öppen, står still
    // idle + andra faser: default upprätt bipN + bob
    const dw=P_W*sx, dh=(dw/aspect)*sy;
    const cx=rb.x+(lowPose?BIPL_W:BIPI_W)/2+ox, cy=GROUND_Y+oy;
    const glow = ph.indexOf('charge')===0 ? Math.min(1,t/0.8) : ph.indexOf('fire')===0 ? 1 : ph==='open'?0.08:0.22;
    // subtle charge halo only (no big blob)
    if(glow>0.3){ ctx.save(); ctx.globalAlpha=0.13*glow; ctx.fillStyle=CORE;
      ctx.beginPath(); ctx.arc(cx, cy-dh*0.5, dw*0.55, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
    // kropp - bilderna ar redan vanda ratt hall, ingen spegling, ingen omfargning
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
    if(img&&img.complete&&img.naturalWidth>0){
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(img,-dw/2,-dh,dw,dh);
    }
    else { ctx.fillStyle='#3a0d0d'; ctx.fillRect(-dw/2,-dh,dw,dh); }
    ctx.restore();
    // focused beam-charge energy at the muzzle (high or low) — clearly the beam, not an eye
    const ey=lowPose?lowY:eyeY, ex=rb.x+14;
    if(glow>0.05){ ctx.save();
      ctx.globalAlpha=0.30+0.5*glow; ctx.fillStyle=HALO; ctx.beginPath(); ctx.arc(ex, ey, 6+9*glow, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha=Math.min(1,0.5+0.5*glow); ctx.fillStyle=CORE; ctx.beginPath(); ctx.arc(ex, ey, 3+5*glow, 0, Math.PI*2); ctx.fill();
      if(glow>0.6 && Math.random()<0.5) particles.push({x:ex,y:ey,vx:-Math.random()*160-40,vy:(Math.random()-0.5)*120,life:0.2,c:Math.random()<0.5?CORE:HALO,s:2+Math.random()*2});
      ctx.restore(); }
  }

    }
  }

  function drawMempoolHUD(){

      ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.strokeRect(chx+0.5,by+bh+5.5,7,7); chx-=11; }

  const BOT_AIRTIME=0.813;   // full-jump hang time (2*|JUMP_V|/GRAV)
  function botThink(dt){
    if(state==='dead'){ if(deadCooldown<=0) start(); return; }
    if(state!=='run') return;
    const px=player.x, pw=P_W, front=px+pw, gnd=player.onGround;
    let needJump=false, needDuck=false, jumpHold=0.42, shortHop=false, shoot=false;

    // ---- collect nearest threats ahead, by kind ----
    let ngObs=null, ngd=1e9;      // solid (ground/fall obstacle) -> jump
    let naObs=null, nad=1e9;      // air bar -> duck
    for(const o of obstacles){
      if(o.x+(o.w||0) < px-6) continue;                // already passed
      const d=o.x-front;
      if(o.type==='rope'){ if(!o.cut && d>10 && d<200) shoot=true; continue; }
      if(o.type==='mtn'){ if(o.hp>0){
          if(level===5){ if(d>-40 && d<380) shoot=true; if(d<ngd){ ngd=d; ngObs=o; } }   // niva 5: kasta dynamit, men var redo att hoppa om den inte hinner sprangas
          else if(charges>0 && d>-40 && d<320) shoot=true;
          else if(charges<=0 && d<ngd){ ngd=d; ngObs=o; } }             // no charge -> treat wall as jump threat (bail)
        continue; }
      if(o.type==='air'){ if(d<nad){ nad=d; naObs=o; } continue; }
      if(level===5 && o.crate && o.variant===1 && o.hp>0 && d>-40 && d<380) shoot=true;   // niva 5: prova sprang endast variant 1 (sprangbar) med dynamit (aldrig obligatoriskt, forfaller till vanligt hopp nedan)
      if(d<ngd){ ngd=d; ngObs=o; }                     // ground / fall solid
    }
    // fallers already on/near the ground path behave like solid blocks
    for(const fb of fallers){ if(fb.state==='warn') continue; if(fb.x+34<px-6) continue;
      const d=fb.x-front; if(d<ngd){ ngd=d; ngObs={type:'fall',w:34}; } }
    // roof gaps -> must jump across
    let ngap=1e9; for(const g of gaps){ if(g.water) continue; if(g.x+g.w<px-6) continue; const d=g.x-front; if(d<ngap) ngap=d; }

    // ---- duck threats (only work while grounded) ----
    // beam only exists during 'fire'; pre-position in late 'charge'. Don't duck during the drone's slow approach.
    const droneDanger = drone && (drone.phase==='fire' || (drone.phase==='charge' && drone.t>0.5));
    const droneLow = drone && drone.beamY>GROUND_Y-90;   // niva 6/7 surf-svepen: lag strale over blocken -> hoppa istallet for att ducka (se M1)
    const airETA = naObs ? nad/speed : 1e9;
    if(naObs){                                          // duck early, and HOLD until the bar's back edge clears the player
      const approaching = nad>0 && nad < speed*0.48;
      const overlapping = naObs.x < px+pw-2 && naObs.x+naObs.w > px+2;
      if(approaching || overlapping) needDuck=true;
    }
    if(droneDanger && !droneLow) needDuck=true;
    // niva 6/7 surf-svep (lag strale): utanfor en aktiv vattenkorsning (fast mark, inga plattforms-mal att traffa
    // exakt) racker ett vanligt sakert hopp. INNANFOR en korsning (blockhoppning) later vi WATER CROSSING-blocket
    // nedan avgora exakt NAR (det ateranvander malberakningen dar sa hoppet aldrig overskjuter ratt block - en
    // fristaende "hoppa nu" har visade sig i test kunna missa blocket och landa i vattnet).
    if(droneDanger && droneLow && gnd && !gaps.some(g=>g.water)){ needJump=true; jumpHold=0.42; }
    if(boss&&(boss.phase==='charge'||boss.phase==='fire')) needDuck=true;
    if(roofBoss){ const ph=roofBoss.phase;
      if(ph==='chargeH'||ph==='fireH') needDuck=true;
      else if(ph==='chargeL'||ph==='fireL'){ if(roofBoss.t>0.5&&gnd){ needJump=true; jumpHold=0.35; } }
      else if(ph==='chargeBall'||ph==='throwBall') needDuck=true;   // pre-duck the incoming rope-ball
      else if(ph==='open'&&fireCd<=0) shoot=true; }
    // niva 7 BIP-slutbossen (Bip_110.png): svinga hammaren nar han ar inom rackhall och ingen strale tvingar duck (samma 320px-fonster som bergssvingen)
    if(l7Bip && l7Bip.hp>0 && charges>0){ const d7=l7Bip.x-front; if(d7>-40 && d7<320) shoot=true; }
    // niva 7 BIP-slutbossen (Bip_110.png): samma dodge-monster som roofBoss - hog strale duckas, lag strale hoppas.
    // Lag strale: tidig charge (t<0.45) tvingar DUCK (=haller boten pa marken, blockerar hammar-plockhopp som annars
    // stal hoppfonstret - empirisk dod ash@fireL), sen hopp i fonstret. fireL med boten annu pa marken -> nodhopp direkt.
    if(l7Bip && l7Bip.hp>0){ const ph7=l7Bip.phase;
      if(ph7==='chargeH'||ph7==='fireH') needDuck=true;
      else if(ph7==='walk'){ if(l7Bip.alt && l7Bip.t>0.6) needDuck=true; }   // nasta attack ar LAG: hall marken sista ~0.45s av walk sa inget hammarhopp landar mitt i fireL (empirisk dod ash@chargeL/fireL)
      else if(ph7==='chargeL'){ if(l7Bip.t<0.45) needDuck=true; else if(gnd){ needJump=true; jumpHold=0.42; } }
      else if(ph7==='fireL'){ if(gnd){ needJump=true; jumpHold=0.42; } } }
    // EXCALIBUR: svinga hammaren nar svardet star pa slagavstand
    if(l7Excal && !l7Excal.struck && charges>0){ const dE=l7Excal.x-front; if(dE>-40 && dE<320) shoot=true; }
    // duck any rope-ball in flight (holds through 'open' so a late ball can't clip the bot)
    for(const rbl of ropeBalls){ const d=rbl.x-front; if(d>-(P_W+BALL_R+8) && d<340) needDuck=true; }   // hall ducken tills kulan HELT passerat spelarkroppen (ratt bottengrans -84, ej -30 - annars reser sig boten mitt i kulan)

    // ---- jump threats (grounded, and not currently forced to duck) ----
    // lead distance so the apex sits over the obstacle, with an early-safety bias + low-speed floor
    const trig=(w)=> Math.max(6, speed*0.05, speed*0.40 - (w+pw)/2);
    if(!needDuck && gnd){
      // if an air bar lands right after, use a short hop so we're grounded in time to duck it
      const tightAfter = airETA < BOT_AIRTIME*1.05;
      if(ngObs && ngd>-30 && ngd<trig(ngObs.w||34)){ needJump=true; jumpHold=0.42; if(tightAfter){ shortHop=true; jumpHold=0.16; } }
      if(!needJump && ngap>-6 && ngap<speed*0.20){ needJump=true; jumpHold=0.45; }
      if(!needJump && level===9 && l9Lamps && l9Lamps.length){                 // DEMO-bot: hoppa upp och tand lamporna sa bana 9 visas ratt
        for(const L of l9Lamps){ if(L.lit)continue; const d=L.x-front;
          if(d>speed*0.30 && d<speed*0.52){ needJump=true; jumpHold=0.5; break; } } }
      if(!needJump && hammer){ const d=hammer.x-front;
        // VAGG-SKYDD (empiri: invuln-bot dog 'wall' 7/8 liv pa finalens tak): hammare som hangs HOGRE over ett inkommande
        // hojt takblock (se hammer-spawn) lockade boten att hoppa mot hammaren fran BASTAKET och landa i blockets nya
        // framkantsvagg. Ligger ett roof-blocks framkant mellan boten och hammaren, och boten inte redan star uppe pa
        // blocket, hoppa INTE for hammaren - strip-regeln tar forst upp boten pa blocket, dar nasta hopp nar hammaren.
        const stripBetween=plats.some(p=>p.roof && p.x>front-6 && (p.x<hammer.x || p.x-front<speed*1.05) && player.y>p.top+6);   // aven block STRAX EFTER hammaren: grab-hoppet fardas ~speed*0.81 och kan annars landa for tatt fore blockvaggen for att hinna om-hoppa   // aven block STRAX EFTER hammaren: grab-hoppet fardas ~speed*0.81 och kan annars landa for tatt fore blockvaggen for att hinna om-hoppa
        if(d>-30 && d<speed*0.40 && !tightAfter && !stripBetween){ needJump=true; jumpHold=0.40; } }
    }

    // ---- WATER CROSSING: hop bank -> stepping stone(s) -> far bank across the wide gap. Generalised for niva 6/7's M1:
    //      several separate water gaps in a row (no stones -> jump the whole gap) plus a surf gap with N stones in sequence
    //      (jump stone-to-stone, or straight to the far bank once past the last stone). Picks the NEAREST not-yet-passed
    //      water gap every frame (not just gaps[0]) so it tracks correctly across multiple sequential gaps. ----
    if(!needDuck && gnd){
      const wg=gaps.filter(g=>g.water && g.x+g.w>px-6).sort((a,b)=>a.x-b.x)[0];
      if(wg && px < wg.x+wg.w){                        // not yet fully across
        const c=px+pw*0.5;                             // player centre drives the fall-through test
        const stones=plats.filter(p=>p.stone && p.x+p.w>wg.x-40 && p.x<wg.x+wg.w+40).sort((a,b)=>a.x-b.x);
        let curRight=null;                             // trailing edge of the surface we stand on
        if(c<wg.x && player.y>=GROUND_Y-2) curRight=wg.x;                        // on the near bank
        else for(const s of stones){ if(c>s.x-2 && c<s.x+s.w+2 && Math.abs(player.y-s.top)<8){ curRight=s.x+s.w; break; } }
        if(curRight!==null){
          const nextStone=stones.find(s=>s.x>curRight-2);
          const nextLeft=nextStone?nextStone.x:(wg.x+wg.w);   // next stone's near edge, or the far bank if none left
          if(c<nextLeft){                               // leap while the centre is still on the surface
            const d=curRight-front;
            // trigger d must scale with the span being jumped (a stone-hop and a full no-stone gap clear need very
            // different lead distances) - a fixed constant here only ever worked for one specific span (~95px stone hop).
            // jump when the FULL hold's horizontal coverage minus the remaining span still leaves >=40px of margin.
            // niva 6/7 surf-drone (lag strale, kraver hopp): en dronare i "charge" far ALDRIG tvinga ett fristaende
            // hopp har (det skulle kunna overskjuta malplattformen och landa i vattnet mellan blocken - sett i test).
            // Istallet: samma mal (nextLeft) ateranvands, bara med en mindre marginal (10 ist. 40) sa spelaren hoppar
            // nagot tidigare men ALLTID fortfarande sakert mot ratt block, aldrig ett orelaterat "hoppa nu"-hopp.
            const span=nextLeft-curRight;
            const urgent=droneDanger && droneLow;
            const trigD=Math.max(20, speed*BOT_AIRTIME-span-(urgent?10:40));
            if(d<trigD){ needJump=true; jumpHold=0.5; }
          }
        }
      }
    }

    // ---- RAISED ROOFTOP: hop UP onto the elevated strip's leading edge; ride it; run off the far edge (physics drops us) ----
    if(gnd){
      let strip=null, sd=1e9;
      for(const p of plats){ if(!p.roof) continue; if(p.x+p.w<px-6) continue; const d=p.x-front; if(d<sd){ sd=d; strip=p; } }
      if(strip){
        const onStrip = player.y<=strip.top+6;                 // already up on it -> just keep running (drop-off is free)
        // lead the jump so the descent (~speed*0.74) lands the box onto the strip top well past the leading edge
        // VAGG-SKYDD: tidigare lead (0.62), forsok anda till kanten (sd>-6), och pa NARA hall (0.40) overstyr aven duck -
        // M2:s buf() garanterar plan yta narmast blocket sa inget hanger over huvudet dar; blockets framkant ar en dodande vagg
        if(!onStrip && sd>-6 && sd<speed*0.62 && (!needDuck || sd<speed*0.40)){ needDuck=false; needJump=true; jumpHold=0.42; }
      }
    }

    // ---- niva 6/7 RARE SAT: fullt hopp rakt upp fran det breda surf-blocket (S4) - alltid sakert aven vid miss eftersom
    //      blockets dvaljetid (260px/fart) overstiger ett fullt hopps flygtid (0.813s), se M1. Egen regel eftersom den
    //      generella myntplock-logiken nedan medvetet star av sig helt sa lange nagot vattengap finns kvar i banan. ----
    if(!needDuck && !needJump && gnd){
      const sat=coinsArr.find(c=>c.sat && !c.got);
      if(sat){
        const onWideStone=plats.find(p=>p.stone && p.w>=200 && Math.abs(player.y-p.top)<8 && px+pw>p.x && px<p.x+p.w);
        if(onWideStone){ const d=sat.x-(px+pw/2); if(d>-40 && d<speed*0.5){ needJump=true; jumpHold=0.5; } }
      }
    }
    // ---- opportunistic coin / tx grab (lowest priority; never when a threat is within a jump) ----
    // ORDER 7-empiri: aldrig plocka-hoppa medan en dronare ar aktiv (hogstrale kan avfyras mitt i hoppet) eller nar en
    // klippa ar inom hopprackhall (mtn raknas ej som ngObs nar charges>0 -> "clearAhead" skulle annars hoppa rakt pa berget).
    const mtnNear = obstacles.some(o=>o.type==='mtn'&&o.hp>0 && o.x-front<speed*1.2 && o.x+MTN_W>front-20);
    const clearAhead = ngd>speed*0.95 && ngap>speed*0.95 && airETA>BOT_AIRTIME*1.1 && !gaps.some(g=>g.water) && !(level>=6 && (drone||mtnNear));   // niva 6/7 (nya M2): plocka-hoppa aldrig under dronare/vid klippa; niva 1-5 oforandrat
    if(!needJump && !needDuck && gnd && clearAhead){
      const grab=(arr)=>{ for(const c of arr){ if(c.got)continue; const d=c.x-(px+pw/2), high=GROUND_Y-c.y;
        if(high>85 && d>speed*0.12 && d<speed*0.33){ needJump=true; jumpHold=Math.min(0.42,0.18+high/800); return true; } } return false; };
      if(!grab(coinsArr)) grab(txArr);
    }

    if(needDuck) needJump=false;                        // duck always wins over a farther jump
    ducking = (needDuck && gnd);
    if(needJump && gnd && botHold<=0){ doJump(); jumpHeld=true; botHold=jumpHold; botShortHop=shortHop; }
    if(botHold>0){ botHold-=dt; if(botHold<=0){ jumpHeld=false; if(botShortHop && player.vy<0){ player.vy*=JUMP_CUT; } botShortHop=false; } }
    if(shoot) doShoot();
  }
  let last=performance.now();
  function frame(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;try{
    if(state==='cleared'){ clearedT+=dt; if(demo&&clearedT>1.2)confirmNext(); render(); drawCleared(); }
    else if(state==='won'){ clearedT+=dt; if(demo&&clearedT>3)start(); render(); drawWon(); }
    else { update(dt); render(); }
  }catch(e){console.error('frame error:',e);}requestAnimationFrame(frame);}
  function drawCleared(){
    ctx.fillStyle='rgba(6,8,14,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#37d67a'; ctx.font='700 15px monospace';
    ctx.fillText('// BLOCK CONFIRMED  +150', W/2, H*0.34);
    ctx.fillStyle=BONE; ctx.font='700 30px monospace';
    ctx.fillText('LEVEL '+Math.min(level,10)+' CLEAR', W/2, H*0.42);
    ctx.fillStyle=ORANGE; ctx.font='700 13px monospace';
    ctx.fillText('NEXT: '+LVL_HINT[Math.min(level+1,10)], W/2, H*0.50);
    if(level===2){ ctx.fillStyle='#8f93b8'; ctx.font='700 11px monospace';
      ctx.fillText('₿ '+coins+'   RARE SAT: '+(rareSatCollectedThisLevel?'FOUND':'MISSED'), W/2, H*0.555); }
    if(clearedT>0.6&&(Math.floor(clearedT*2)%2===0)){ ctx.fillStyle='#8f93b8'; ctx.font='700 12px monospace';
      ctx.fillText('TAP FOR NEXT BLOCK', W/2, H*0.58); }
  }
  // niva 7-final: Excalibur ur en gra kantig sten, ritad i kod enligt spec (silverblad+ljus mittlinje,
  // guldparerstang+rod adelsten, morkblatt grepp+guldknopp, gra kantig sten).
  function drawExcaliburScene(cx, baseY){
    ctx.save();
    ctx.fillStyle='#6b6f75';
    ctx.beginPath();
    ctx.moveTo(cx-92, baseY+58); ctx.lineTo(cx-70, baseY+10); ctx.lineTo(cx-40, baseY+28);
    ctx.lineTo(cx-8, baseY-2); ctx.lineTo(cx+22, baseY+22); ctx.lineTo(cx+54, baseY+2);
    ctx.lineTo(cx+90, baseY+50); ctx.lineTo(cx+70, baseY+70); ctx.lineTo(cx-72, baseY+70);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#84898f';
    ctx.beginPath(); ctx.moveTo(cx-70,baseY+10); ctx.lineTo(cx-40,baseY+28); ctx.lineTo(cx-52,baseY+40); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4d5155';
    ctx.beginPath(); ctx.moveTo(cx+22,baseY+22); ctx.lineTo(cx+54,baseY+2); ctx.lineTo(cx+62,baseY+34); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#2b2d30';
    ctx.beginPath(); ctx.moveTo(cx-6,baseY-2); ctx.lineTo(cx+8,baseY+2); ctx.lineTo(cx+2,baseY+16); ctx.lineTo(cx-10,baseY+10); ctx.closePath(); ctx.fill();
    const bw=16, bTip=baseY-96, bBase=baseY;
    ctx.fillStyle='#c9d3d8';
    ctx.beginPath(); ctx.moveTo(cx,bTip); ctx.lineTo(cx+bw/2,bTip+18); ctx.lineTo(cx+bw/2,bBase); ctx.lineTo(cx-bw/2,bBase); ctx.lineTo(cx-bw/2,bTip+18); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#eef4f6'; ctx.fillRect(cx-2, bTip+16, 4, bBase-bTip-16);
    ctx.fillStyle='#d9a832'; ctx.fillRect(cx-34, baseY-108, 68, 12);
    ctx.fillStyle='#c9942a'; ctx.fillRect(cx-34, baseY-98, 68, 4);
    ctx.fillStyle='#c81e2c'; ctx.beginPath(); ctx.arc(cx, baseY-102, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff6b74'; ctx.beginPath(); ctx.arc(cx-2, baseY-104, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#1c2a52'; ctx.fillRect(cx-7, baseY-150, 14, 42);
    ctx.fillStyle='#28387a'; ctx.fillRect(cx-7, baseY-150, 4, 42);
    ctx.fillStyle='#d9a832'; ctx.beginPath(); ctx.arc(cx, baseY-154, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#f2c65c'; ctx.beginPath(); ctx.arc(cx-3, baseY-157, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawWon(){
    ctx.fillStyle='rgba(6,8,14,0.62)'; ctx.fillRect(0,0,W,H);
    drawExcaliburScene(W/2, H*0.50);
    ctx.textAlign='center';
    ctx.fillStyle='#37d67a'; ctx.font='700 14px monospace';
    ctx.fillText('// BIP-110 NEDKÄMPAD · BERGET KROSSAT', W/2, H*0.20);
    ctx.fillStyle=BONE; ctx.font='700 26px monospace';
    ctx.fillText('EXCALIBUR', W/2, H*0.27);
    ctx.fillStyle=ORANGE; ctx.font='700 12px monospace';
    ctx.fillText('BLOCKRUNNER — COMPLETE', W/2, H*0.87);
    if(clearedT>0.6&&(Math.floor(clearedT*2)%2===0)){ ctx.fillStyle='#8f93b8'; ctx.font='700 12px monospace';
      ctx.fillText('TAP TO PLAY AGAIN', W/2, H*0.93); }
  }
  resize();reset();document.getElementById('bestVal').textContent='BEST 0';
  // ---- character picker on the start screen ----
  function charSave(i){ try{ if(window.storage) window.storage.set('bh:char',String(i),false); }catch(e){} }
  function buildCharSelect(){
    const wrap=document.getElementById('charSelect'); if(!wrap) return; wrap.innerHTML='';
    CHARS.forEach((c,i)=>{
      const cell=document.createElement('div'); cell.className='ch'+(i===selChar?' sel':'');
      const im=document.createElement('img'); im.alt=c.name;
      im.src = c.def ? sprite.src : c.img.src;               // CLASSIC previews the in-game sprite
      cell.appendChild(im);
      cell.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation();
        selChar=i; charSave(i);
        wrap.querySelectorAll('.ch').forEach((el,j)=>el.classList.toggle('sel',j===i)); });
      wrap.appendChild(cell);
    });
  }
  buildCharSelect();
  (async()=>{ try{ if(window.storage){ const r=await window.storage.get('bh:name',false);
    if(r&&r.value){ const inp=document.getElementById('nameInput'); if(inp) inp.value=r.value; }
    const rc=await window.storage.get('bh:char',false);
    if(rc&&rc.value){ const i=Math.max(0,Math.min(CHARS.length-1,parseInt(rc.value,10)||0)); selChar=i; buildCharSelect(); } } }catch(e){} })();
  requestAnimationFrame(frame);

  // ---------- TESTLÄGE (förhandsgranska händelser utan att spela dit) ----------
  (function(){
    if(location.hash.indexOf('dev')<0) return;
    const btn=document.createElement('button');
    btn.textContent='TEST'; btn.id='devToggle';
    btn.style.cssText='position:fixed;left:8px;bottom:8px;z-index:60;background:none;border:1px solid #444;color:#666;font:700 11px monospace;padding:6px 10px;letter-spacing:2px;opacity:.7';
    document.body.appendChild(btn);
    const panel=document.createElement('div');
    panel.style.cssText='position:fixed;left:8px;bottom:44px;z-index:60;display:none;flex-direction:column;gap:6px';
    const mk=(label,fn)=>{const b=document.createElement('button');b.textContent=label;
      b.style.cssText='background:#1a2233;border:1px solid #f7a000;color:#f7a000;font:700 12px monospace;padding:8px 12px;letter-spacing:1px';
      b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();fn();});panel.appendChild(b);};
    mk('DRONE', ()=>{ if(state!=='run')start(); speed=Math.max(speed,380); drone=null; spawnDrone(); });
    mk('HAMMER', ()=>{ if(state!=='run')start(); hammer={x:W+50,y:GROUND_Y-HAM_Y_OFF,bob:0}; });
    mk('SURGE', ()=>{ if(state!=='run')start(); blockFill=1; surge={phase:'warn',t:0,left:0,gapT:0}; });
    mk('SPEED +', ()=>{ if(state!=='run')start(); speed+=120; });
    mk('STREET BOSS', ()=>{ if(state!=='run')start(); drone=null; surge=null; boss={x:W+180,phase:'in',t:0,bob:0,shots:0,absorbed:false}; });
    mk('SHIELD', ()=>{ if(state!=='run')start(); hasShield=true; });
    mk('LVL 6: WATER+ROOF', ()=>{ startLevel=6; maxLevel=Math.max(maxLevel,6); refreshLvlSel(); start(); });
    mk('LVL 7: STORM', ()=>{ startLevel=7; maxLevel=Math.max(maxLevel,10); refreshLvlSel(); start(); });
    mk('LVL 8: NIGHT', ()=>{ startLevel=8; maxLevel=Math.max(maxLevel,10); refreshLvlSel(); start(); });
    mk('LVL 9: BLACKOUT', ()=>{ startLevel=9; maxLevel=Math.max(maxLevel,10); refreshLvlSel(); start(); });
    mk('LVL 10: FINAL', ()=>{ startLevel=10; maxLevel=Math.max(maxLevel,10); refreshLvlSel(); start(); });
    document.body.appendChild(panel);
    btn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();
      panel.style.display=panel.style.display==='none'?'flex':'none';});
  })();

  // ---------- DEBUG HOOK (endast med #dev i URL:en – för automatiserad testning) ----------
  if(location.hash.indexOf('dev')>=0){
    window.__levelUpLog=[];
    window.__m2log=[];
    window.__bh={
      snap:()=>({level,state,lvlDist,dist,speed,zone,bossDone,coins,score,demo,startLevel,
        heartsGot,starsThrown,charges,hasShield,py:player&&player.y,
        charName:CHARS[selChar]&&CHARS[selChar].name,selChar,
        exhaustedT:+exhaustedT.toFixed(2),igrace:+igrace.toFixed(2),
        hearts:hearts.length,heartX:hearts.length?Math.round(hearts[0].x-(player.x+P_W/2)):null,
        coinsOnField:coinsArr.length,
        elev:player?Math.round(GROUND_Y-player.y):0,roofStrips:plats.filter(p=>p.roof).length,
        bossCycle:roofBoss?roofBoss.cycle:null,bossTarget:roofBoss?(roofBoss.cycleTarget||3):null,
        balls:ropeBalls.length,ballX:ropeBalls.length?Math.round(ropeBalls[0].x-player.x):null,ducking,
        dynAmmo,dynPk:dynPickups.filter(p=>!p.got).length,runesGot,
        mtnHp:(()=>{const m=obstacles.filter(o=>o.type==='mtn'&&o.hp>0).sort((a,b)=>a.x-b.x)[0];return m?m.hp:null;})(),
        mtnDx:(()=>{const m=obstacles.filter(o=>o.type==='mtn'&&o.hp>0).sort((a,b)=>a.x-b.x)[0];return m?Math.round(m.x-(player.x+P_W)):null;})(),
        mtnSpawned,mtn5Destroyed,satsGot,rareSatCollectedThisLevel,cause:lastDeathCause,swingT:+swingT.toFixed(2),
        droneBeamY:drone?Math.round(drone.beamY):null,waterOn:gaps.some(g=>g.water),
        l6RoofMode,l6RoofBlend:+l6RoofBlend.toFixed(2),roofHintT:+roofHintT.toFixed(2),
        phase:(roofBoss&&('roof:'+roofBoss.phase))||(boss&&('boss:'+boss.phase))||(drone&&('drone:'+drone.phase))||null,
        l7:{land:l7Land,bergSpawned:l7BergSpawned,bergDone:l7BergDone,bipDone:l7BipDone,hamSpawned:l7HamSpawned,
            bip:l7Bip?{phase:l7Bip.phase,hp:l7Bip.hp,dx:Math.round(l7Bip.x-(player.x+P_W))}:null,excal:l7ExcalDone?'done':(l7Excal?(l7Excal.struck?'struck':'wait'):null)}}),
      play:(n)=>{ demo=true; startLevel=Math.max(1,Math.min(10,n|0)); maxLevel=Math.max(maxLevel,startLevel); start(); },
      setDemo:(b)=>{ demo=!!b; },
      setInvuln:(b)=>{ demoInvuln=!!b; },   // #dev-only: stang av demo-shrugen sa boten kan do pa riktigt for automatiserad empiri
      setChar:(v)=>{ const i=(typeof v==='string')?CHARS.findIndex(c=>c.name===v):(v|0); if(i>=0&&i<CHARS.length){ selChar=i; if(typeof charSave==='function')charSave(i); if(typeof buildCharSelect==='function')buildCharSelect(); } return CHARS[selChar].name; },
      trait:()=>trait(),
      forceDie:(c)=>die(c),
      gapsRaw:()=>gaps.map(g=>({x:Math.round(g.x),w:Math.round(g.w),water:!!g.water})),
      startAt:(n)=>{ demo=false; startLevel=Math.max(1,Math.min(10,n|0)); maxLevel=Math.max(maxLevel,startLevel); start(); },
      clearIGrace:()=>{ igrace=0; },
      // spawn a pickup relative to the player's centre (dx px ahead, dy px below player-mid)
      spawnCoinAt:(dx,dy)=>{ if(state==='run')coinsArr.push({x:player.x+P_W/2+(dx==null?260:dx),y:player.y-curH()*0.5+(dy||0),bob:0,got:false}); },
      spawnHeartAt:(dx,dy)=>{ if(state==='run')hearts.push({x:player.x+P_W/2+(dx==null?260:dx),y:player.y-curH()*0.5+(dy||0),bob:0,got:false}); },
      clearPickups:()=>{ coinsArr.length=0; hearts.length=0; dynPickups.length=0; },
      clearObstacles:()=>{ obstacles.length=0; gaps.length=0; drone=null; boss=null; roofBoss=null; surge=null; ropeBalls.length=0; fallers.length=0; dynamites.length=0; },
      coinInfo:()=>({n:coinsArr.length,coins,dx:coinsArr[0]?Math.round(coinsArr[0].x-(player.x+P_W/2)):null,cy:coinsArr[0]?Math.round(coinsArr[0].y):null}),
      heartInfo:()=>({n:hearts.length,heartsGot,dx:hearts[0]?Math.round(hearts[0].x-(player.x+P_W/2)):null}),
      setScoreState:(d,c,b)=>{ if(d!=null)dist=d; if(c!=null)coins=c; if(b!=null)bonus=b; },
      getBonus:()=>bonus,
      airHit:()=>{ // does a standing player's head collide with a standard air bar? (true=collides=dies)
        const t=trait(), airLen=t.airLeniency||0, top=player.y-H_STAND, bottom=GROUND_Y-BAR_BOTTOM_OFF; return (top+airLen)<bottom; },
      obstaclePad:()=>{ const t=trait(); return t.hitPad!=null?t.hitPad:7; },
      setHearts:(n)=>{ heartsGot=n|0; },
      spawnHammer:()=>{ if(state==='run'){ speed=Math.max(speed,340); hammer={x:W+50,y:GROUND_Y-HAM_Y_OFF,bob:0}; } },
      scene:()=>({ level,lvlDist:Math.round(lvlDist),speed:Math.round(speed),zone,
        p:{x:Math.round(player.x),y:Math.round(player.y),onGround:player.onGround,ducking,vy:Math.round(player.vy)},
        obs:obstacles.filter(o=>o.x>player.x-60&&o.x<player.x+260).map(o=>({t:o.type,x:Math.round(o.x-player.x),w:Math.round(o.w||0),h:Math.round(o.h||0),bottom:o.bottom?Math.round(o.bottom):undefined})),
        gaps:gaps.filter(g=>g.x+g.w>player.x-60&&g.x<player.x+520).map(g=>({x:Math.round(g.x-player.x),w:Math.round(g.w),water:!!g.water})),
        plats:plats.filter(p=>p.x+p.w>player.x-60&&p.x<player.x+520).map(p=>({x:Math.round(p.x-player.x),w:Math.round(p.w),top:Math.round(p.top),stone:!!p.stone,roof:!!p.roof})),
        fallers:fallers.filter(f=>f.x>player.x-60&&f.x<player.x+320).map(f=>({x:Math.round(f.x-player.x),y:Math.round(f.y),st:f.state})),
        drone:drone?{phase:drone.phase,t:+drone.t.toFixed(2)}:null })
    };
  }
})();
</script>
<script>
(function(){
  var p=new URLSearchParams(location.search),g=p.get('guest');
  if(g===null)return;
  var left=parseInt(g,10)||0;
  var b=document.createElement('div');
  b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#F85000;color:#0B0B0B;font:700 10px/1 ui-monospace,monospace;letter-spacing:.18em;padding:6px 12px;text-align:center;pointer-events:auto;';
  b.innerHTML=(left>0?left+' FREE RUN'+(left>1?'S':'')+' LEFT — ':'LAST FREE RUN — ')+'<a href="/?connect=1" style="color:#0B0B0B;text-decoration:underline;">VERIFY BLOCKHEADS WALLET TO UNLOCK</a>';
  document.body.appendChild(b);
})();
</script>
